<style>
  /* ---------- same tokens as styles.css ---------- */
  :root {
    --paper:       #f1f2ed;
    --paper-alt:   #e7e9e1;
    --ink:         #191b1a;
    --ink-soft:    #5b5f5a;
    --ink-faint:   #9a9d94;
    --accent:      #2d4159;
    --accent-soft: #7c93a6;
    --rule:        #d3d5cc;
    --radius: 3px;

    --font-display: "Newsreader", Georgia, serif;
    --font-body: "Work Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
  }
  [data-theme="dark"] {
    --paper:       #14161a;
    --paper-alt:   #1b1e22;
    --ink:         #ecede7;
    --ink-soft:    #9a9d96;
    --ink-faint:   #666a63;
    --accent:      #8fadcb;
    --accent-soft: #5c7185;
    --rule:        #2a2d31;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* fixed canvas — this file is only ever captured at 1200x630
     (the standard og:image / twitter:image size), never resized */
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    transition: background .2s ease, color .2s ease;
  }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 64px;
    padding: 80px 88px;
  }
  .card::after {
    content: "";
    position: absolute;
    inset: 28px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    pointer-events: none;
  }

  /* ---------- left: text stack ---------- */
  .content { max-width: 620px; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 15px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 22px;
    display: block;
  }
  .title {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    font-size: 60px;
    line-height: 1.1;
    letter-spacing: -.01em;
    color: var(--ink);
    margin-bottom: 26px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .desc {
    font-family: var(--font-body);
    font-weight: 300;
    font-size: 21px;
    line-height: 1.55;
    color: var(--ink-soft);
    max-width: 560px;
    margin-bottom: 44px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .wordmark {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-family: var(--font-mono);
    font-size: 15px;
    color: var(--ink);
    border: 1px solid var(--rule);
    padding: 8px 14px;
    border-radius: var(--radius);
  }
  .wordmark .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
  }
  .wordmark .accent { color: var(--accent); }

  /* ---------- right: pixel avatar ---------- */
  .avatar-col {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .avatar-panel {
    position: relative;
    width: 340px;
    height: 340px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .avatar-panel svg { position: relative; width: 258px; height: 258px; background: transparent; }
  .avatar-caption {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--ink-faint);
    letter-spacing: .02em;
  }
</style>
</head>

<script>
/* ---------- what makes this "dynamic" ----------
   Nothing renders until the query string is read: pass ?page=blog for a
   baked-in preset, or override any field directly with ?title=&desc=&eyebrow=.
   theme=dark switches the card to the dark palette. This is the ONE file
   every link on the site points its screenshot step at — only the params
   in the URL change. See generate-og-images.js for batch-rendering every
   page's card to a static PNG (required for real crawlers — see notes). */
(function () {
  "use strict";

  var PRESETS = {
    home:    { eyebrow: "BLOG.ASHIQUR.IN", title: "Ashiqur Rahman", desc: "Learning, experiencing, thinking, and testing things.", link: "blog.ashiqur.in" },
    blog:    { eyebrow: "WRITING",    title: "The Blog",       desc: "Entries, Posts & Works",                          link: "blog.ashiqur.in/blog" },
    about:   { eyebrow: "ABOUT",      title: "About Ashiqur",  desc: "A little more about who Ashiqur Rahman is.",              link: "blog.ashiqur.in/about" },
    contact: { eyebrow: "CONTACT",    title: "Get in touch",   desc: "Email, socials, and everything else.",                             link: "blog.ashiqur.in/contact" },
    "404":   { eyebrow: "404",        title: "Page not found", desc: "This page doesn't exist. Head back home.",                         link: "blog.ashiqur.in" }
  };

  var params = new URLSearchParams(window.location.search);
  var base = PRESETS[params.get("page")] || PRESETS.home;

  var eyebrow = params.get("eyebrow") || base.eyebrow;
  var title   = params.get("title")   || base.title;
  var desc    = params.get("desc")    || base.desc;
  var link    = params.get("link")    || base.link;
  var theme   = params.get("theme") === "dark" ? "dark" : "light";

  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("og-eyebrow").textContent = eyebrow;
  document.getElementById("og-title").textContent = title;
  document.getElementById("og-desc").textContent = desc;
  document.getElementById("og-link").textContent = link;
})();
</script>
