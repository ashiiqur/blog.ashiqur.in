<!-- Tiny, dependency-free QR encoder (kazuhikoarase/qrcode-generator, MIT).
     Used to draw a scannable QR square on every link card. -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

<!-- html-to-image (bubkoo/html-to-image, MIT). Used to export the enlarged
     QR popup as a transparent PNG when the download button is tapped. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.13/html-to-image.min.js"></script>
<script>
/* ================================================================
   ✏️  ADD A NEW LINK
   Copy the block below, paste it anywhere inside the `links` array,
   fill in the blanks, save the file. A new card appears automatically
   under the right heading — tilt, tape colour and animation are all
   handled for you.

   {
     label:    "Platform name",     // big handwritten word on the card
     handle:   "@your-handle",      // small typewriter line underneath
     url:      "https://...",       // where the card links to
     note:     "short description", // one line about what's there
     icon:     "pin",               // youtube, x, facebook, github,
                                     // instagram, linkedin, play — or
                                     // leave as "pin" for a generic doodle
     category: "other"              // "social", "work", or "other" —
                                     // decides which heading it sits under
   },
   ================================================================ */
const links = [
  { label:"YouTube",   handle:"@ashiqur_sf",       url:"https://www.youtube.com/@ashiqur_sf",  note:"videos & tutorials",        icon:"youtube",   category:"social" },
  { label:"X",         handle:"@ashiqur_sf",       url:"https://twitter.com/ashiqur_sf",       note:"thoughts & threads",        icon:"x",         category:"social" },
  { label:"Facebook",  handle:"ashiqur.sf",        url:"https://www.facebook.com/ashiqur.sf",  note:"updates & photos",          icon:"facebook",  category:"social" },
  { label:"Instagram", handle:"ashiqur.sf",        url:"https://www.instagram.com/ashiqur.sf", note:"photos & moments",          icon:"instagram", category:"social" },
  { label:"GitHub",    handle:"ashiiqur",          url:"https://github.com/ashiiqur",          note:"code & projects",           icon:"github",    category:"work" },
  { label:"LinkedIn",  handle:"in/ashiiiiqur",     url:"https://www.linkedin.com/in/ashiiiiqur",note:"work & professional life", icon:"linkedin",  category:"work" },
  { label:"Google Play", handle:"Developer profile", url:"https://play.google.com/store/apps/dev?id=7103456648156868105", note:"android apps", icon:"play", category:"work" }
];

/* section headings shown, in this order — a category only appears if it
   has at least one link in it, so "Other" stays hidden until you use it */
const categoryOrder  = ["social","work","other"];
const categoryLabels = { social:"Social", work:"Work", other:"Other" };

/* ---- hand-drawn platform icon doodles (add your own key if you like) ---- */
const icons = {
  youtube:   `<svg viewBox="0 0 48 48"><rect x="6" y="12" width="36" height="24" rx="8"/><path class="fill" d="M20 18l13 6-13 6z"/></svg>`,
  x:         `<svg viewBox="0 0 48 48"><path d="M8 10h32a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H20l-8 8v-8H8a2 2 0 0 1-2-2V12a2 2 0 0 1 2-2z"/><path d="M17 17l14 12M31 17l-14 12"/></svg>`,
  facebook:  `<svg viewBox="0 0 48 48"><path d="M11 24h6v16h6V24h7l1-8h-8v-4c0-2 1-3 3-3h5V2h-7c-6 0-9 4-9 10v4h-4z"/></svg>`,
  github:    `<svg viewBox="0 0 48 48"><path d="M17 14L7 24l10 10"/><path d="M31 14l10 10-10 10"/><path d="M27 9l-6 30"/></svg>`,
  instagram: `<svg viewBox="0 0 48 48"><rect x="7" y="12" width="34" height="26" rx="7"/><circle cx="24" cy="25" r="7.5"/><circle class="fill" cx="33.5" cy="18" r="1.6"/></svg>`,
  linkedin:  `<svg viewBox="0 0 48 48"><rect x="8" y="18" width="32" height="20" rx="3"/><path d="M18 18v-4a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v4"/><path d="M8 27h32"/></svg>`,
  play:      `<svg viewBox="0 0 48 48"><rect x="14" y="6" width="20" height="36" rx="4"/><path d="M20 38h8"/><path class="fill" d="M24 13l2.6 5.4 5.9.7-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.2 5.9-.7z"/></svg>`,
  pin:       `<svg viewBox="0 0 48 48"><path d="M24 6c-7.5 0-13 5.6-13 13 0 9.7 13 23 13 23s13-13.3 13-23c0-7.4-5.5-13-13-13z"/><circle cx="24" cy="19" r="4.5"/></svg>`
};

/* small utility doodles: open-arrow and copy icon */
const utilIcons = {
  arrow: `<svg viewBox="0 0 32 32"><path d="M10 22L22 10"/><path d="M13 10h9v9"/></svg>`,
  copy:  `<svg viewBox="0 0 32 32"><rect x="5" y="11" width="15" height="15" rx="3"/><rect x="12" y="6" width="15" height="15" rx="3"/></svg>`
};

const tapeColors = ["var(--tape-yellow)", "var(--tape-pink)", "var(--tape-mint)"];
const rotations  = [-2, 1.6, -1.2, 2.1, -1.7, 1.1, -2.3, 1.9];
const qrRotations = [-4, 3, -2.5, 4.5, -3.5, 2.5, -5, 3.5];

/* Renders a URL as a small QR square, drawn as an inline SVG so it can be
   styled with the theme's ink colour (see .card-qr in the stylesheet).
   If the qrcode-generator library didn't load (e.g. offline), the card
   quietly just skips the QR rather than breaking. */
function qrSvgString(url){
  if (typeof qrcode !== "function") return "";
  try {
    const qr = qrcode(0, "M");
    qr.addData(url);
    qr.make();
    const n = qr.getModuleCount();
    let rects = "";
    for (let r = 0; r < n; r++){
      for (let c = 0; c < n; c++){
        if (qr.isDark(r, c)) rects += `<rect x="${c}" y="${r}" width="1" height="1" rx="0.24" ry="0.24"/>`;
      }
    }
    return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="QR code for this link">${rects}</svg>`;
  } catch (e) {
    return "";
  }
}

function buildCard(link, i){
  const card = document.createElement("div");
  card.className = "card";
  card.style.setProperty("--rot", rotations[i % rotations.length] + "deg");
  card.style.setProperty("--tape", tapeColors[i % tapeColors.length]);
  card.style.setProperty("--delay", (i * 90) + "ms");
  card.style.setProperty("--qr-rot", qrRotations[i % qrRotations.length] + "deg");

  card.innerHTML = `
    <span class="tape-piece" aria-hidden="true"></span>
    <a class="card-link" href="${link.url}" target="_blank" rel="noopener noreferrer">
      <span class="card-icon" aria-hidden="true">${icons[link.icon] || icons.pin}</span>
      <span class="card-text">
        <span class="card-label">${link.label}<span class="ink-underline"></span></span>
        <span class="card-handle">${link.handle}</span>
        <span class="card-note">${link.note}</span>
      </span>
      <span class="card-qr" role="button" tabindex="0" aria-label="View larger QR code for ${link.label}" title="Tap to enlarge">${qrSvgString(link.url)}</span>
      <span class="card-arrow" aria-hidden="true">${utilIcons.arrow}</span>
    </a>
    <button class="copy-btn" type="button" aria-label="Copy ${link.label} link">
      <span class="copy-icon" aria-hidden="true">${utilIcons.copy}</span>
      <span class="copy-toast" role="status" aria-live="polite"></span>
    </button>
  `;

  const btn = card.querySelector(".copy-btn");
  btn.addEventListener("click", () => copyLink(link.url, btn));

  /* tapping/activating the QR opens the bigger popup instead of
     following the card's link — it sits inside the <a>, so the
     navigation has to be stopped explicitly here. */
  const qrEl = card.querySelector(".card-qr");
  const tapeColor = tapeColors[i % tapeColors.length];
  const openThisQr = (e) => {
    e.preventDefault();
    e.stopPropagation();
    openQrModal(link, tapeColor);
  };
  qrEl.addEventListener("click", openThisQr);
  qrEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") openThisQr(e);
  });

  return card;
}

function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand("copy"); } catch (e) { /* ignore */ }
  document.body.removeChild(ta);
}

function copyLink(url, btn){
  const toast = btn.querySelector(".copy-toast");
  const announce = () => {
    toast.textContent = "✓ copied!";
    toast.classList.add("show");
    btn.classList.add("just-copied");
    clearTimeout(btn._toastTimer);
    btn._toastTimer = setTimeout(() => {
      toast.classList.remove("show");
      btn.classList.remove("just-copied");
    }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(announce).catch(() => { fallbackCopy(url); announce(); });
  } else {
    fallbackCopy(url);
    announce();
  }
}

/* ---- QR enlarge modal ---- */
const qrModalOverlay  = document.getElementById("qr-modal-overlay");
const qrModalCard     = document.querySelector(".qr-modal");
const qrModalQr       = document.getElementById("qr-modal-qr");
const qrModalLabel    = document.getElementById("qr-modal-label");
const qrModalUrl      = document.getElementById("qr-modal-url");
const qrModalClose    = document.getElementById("qr-modal-close");
const qrModalDownload = document.getElementById("qr-modal-download");
let qrModalLastFocused = null;
/* Tracks whether we've pushed a history entry for the open modal, so the
   device/browser back button closes the popup instead of navigating away
   from the page. */
let qrModalHistoryPushed = false;

function openQrModal(link, tapeColor){
  if (!qrModalOverlay || !qrModalQr) return;
  qrModalQr.innerHTML = qrSvgString(link.url);
  qrModalQr.style.background = tapeColor || "var(--paper)";
  qrModalLabel.textContent = link.label;
  qrModalUrl.textContent = link.url;

  qrModalLastFocused = document.activeElement;
  qrModalOverlay.hidden = false;
  document.body.style.overflow = "hidden";
  requestAnimationFrame(() => requestAnimationFrame(() => {
    qrModalOverlay.classList.add("open");
  }));
  qrModalClose.focus();

  /* Push a dummy history entry so a back-button/gesture press while the
     popup is open just pops this entry (closing the popup) instead of
     leaving the page. */
  history.pushState({ qrModal: true }, "");
  qrModalHistoryPushed = true;
}

/* fromPopState is true when this was triggered by the back button (via the
   popstate listener below) — in that case the history entry is already
   being consumed by the browser, so we must NOT call history.back() again. */
function closeQrModal(fromPopState){
  if (!qrModalOverlay || !qrModalOverlay.classList.contains("open")) return;
  qrModalOverlay.classList.remove("open");
  document.body.style.overflow = "";
  setTimeout(() => { qrModalOverlay.hidden = true; }, 220);
  if (qrModalLastFocused && typeof qrModalLastFocused.focus === "function") qrModalLastFocused.focus();

  if (qrModalHistoryPushed) {
    qrModalHistoryPushed = false;
    if (!fromPopState) history.back();
  }
}

/* Back button / gesture while the popup is open: close the popup instead
   of navigating to the previous page. */
window.addEventListener("popstate", () => {
  if (qrModalOverlay && qrModalOverlay.classList.contains("open")) {
    closeQrModal(true);
  }
});

/* ---- QR popup download: render the card to a transparent PNG ----
   Uses html-to-image to snapshot the whole popup (tape, QR, label,
   hint, URL) exactly as it looks on screen, skipping the close/download
   buttons themselves, and hands the browser a PNG with no page
   background baked in. */
async function downloadQrModal(){
  if (!qrModalCard) return;
  if (typeof htmlToImage === "undefined") {
    console.error("html-to-image failed to load — check your connection.");
    return;
  }
  qrModalDownload.classList.add("is-busy");
  try {
    const dataUrl = await htmlToImage.toPng(qrModalCard, {
      pixelRatio: 3,
      cacheBust: true,
      filter: (node) => {
        if (!node.classList) return true;
        return !node.classList.contains("qr-modal-close") && !node.classList.contains("qr-modal-download");
      }
    });
    const rawName  = (qrModalLabel && qrModalLabel.textContent) ? qrModalLabel.textContent : "qr-code";
    const safeName = rawName.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "qr-code";
    const a = document.createElement("a");
    a.href = dataUrl;
    a.download = `${safeName}-qr.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch (err) {
    console.error("QR download failed:", err);
  } finally {
    qrModalDownload.classList.remove("is-busy");
  }
}

if (qrModalOverlay){
  qrModalOverlay.addEventListener("click", (e) => {
    if (e.target === qrModalOverlay) closeQrModal();
  });
}
if (qrModalClose) qrModalClose.addEventListener("click", closeQrModal);
if (qrModalDownload) qrModalDownload.addEventListener("click", downloadQrModal);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeQrModal();
});

/* build the grouped sections */
const root = document.getElementById("links-root");
categoryOrder.forEach(cat => {
  const items = links.filter(l => (l.category || "other") === cat);
  if (items.length === 0) return;

  const section = document.createElement("section");
  section.className = "link-group";
  section.setAttribute("aria-label", categoryLabels[cat]);
  section.innerHTML = `<h2 class="section-heading"><span class="star" aria-hidden="true">✦</span>${categoryLabels[cat]}</h2>`;

  const grid = document.createElement("div");
  grid.className = "links-grid";
  items.forEach(link => grid.appendChild(buildCard(link, links.indexOf(link))));
  section.appendChild(grid);

  root.appendChild(section);
});

/* spiral holes — count adapts, spacing handled by flexbox */
const holesEl = document.getElementById("holes");
for (let i = 0; i < 16; i++) {
  const h = document.createElement("span");
  h.className = "hole";
  holesEl.appendChild(h);
}

/* today's date, footer */
document.getElementById("today").textContent = new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });

/* draw-on animation for every platform icon, if the browser supports it.
   Priming (dasharray + full offset, no transition) happens immediately so
   every icon is hidden-and-ready before the page is revealed. The actual
   draw-in transition is deferred until the "page-reveal" event (fired once
   the fonts-ready gate above lifts) — otherwise, on a slow connection, the
   whole transition can run to completion while the page is still
   visibility:hidden, so by the time it's shown the icons are already fully
   drawn and no motion is visible. */
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const iconEls = [];
document.querySelectorAll(".card-icon svg").forEach((svg, i) => {
  const shapes = svg.querySelectorAll("path, circle, rect");
  shapes.forEach((el) => {
    if (el.classList.contains("fill")) return;
    if (typeof el.getTotalLength !== "function") return;
    try {
      const len = el.getTotalLength();
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = reduceMotion ? 0 : len;
      if (!reduceMotion) iconEls.push({ el, i });
    } catch (e) { /* skip silently if unsupported */ }
  });
});

function playIconDrawIn(){
  iconEls.forEach(({ el, i }) => {
    el.style.transition = `stroke-dashoffset .7s ease ${(i * 90) + 250}ms`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.strokeDashoffset = 0;
    }));
  });
}

if (document.documentElement.classList.contains("fonts-ready")) {
  playIconDrawIn();
} else {
  window.addEventListener("page-reveal", playIconDrawIn, { once: true });
}

/* ---- scroll position note (hand-drawn, theme-matched) ----
   Shows a little taped sticky-note next to the scrollbar while
   scrolling, naming the section currently in view, then fades
   away shortly after scrolling stops. */
(function(){
  const note = document.getElementById("scroll-note");
  const noteText = document.getElementById("scroll-note-text");
  if (!note || !noteText) return;

  const sections = Array.from(document.querySelectorAll(".link-group"));
  let hideTimer;

  function percentScrolled(){
    const doc = document.documentElement;
    const max = doc.scrollHeight - doc.clientHeight;
    return max > 0 ? window.scrollY / max : 0;
  }

  /* moves the note up/down the right edge in step with the scrollbar */
  function positionNote(percent){
    const vh = window.innerHeight;
    const edgeMargin = 46;
    const top = edgeMargin + percent * (vh - edgeMargin * 2);
    note.style.top = top + "px";
  }

  function labelForPercent(percent){
    if (percent < 0.04) return "Top ↑";
    if (percent > 0.96) return "That's all ✓";

    const lookLine = window.innerHeight * 0.4;
    let current = null;
    for (const sec of sections) {
      if (sec.getBoundingClientRect().top <= lookLine) current = sec;
    }
    return current ? current.getAttribute("aria-label") : "Scrolling…";
  }

  function updateNote(){
    const percent = percentScrolled();
    positionNote(percent);
    noteText.textContent = labelForPercent(percent);
    note.classList.add("visible");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => note.classList.remove("visible"), 850);
  }

  positionNote(percentScrolled());
  window.addEventListener("scroll", updateNote, { passive:true });
  window.addEventListener("resize", () => positionNote(percentScrolled()), { passive:true });
})();

/* ---- side photos: blurred until tapped, remembered per browser ---- */
(function(){
  const STORAGE_PREFIX = "sidePhotoRevealed:";
  const buttons = document.querySelectorAll(".side-photo[data-key]");

  // once a photo is revealed, lock the button down: no more clicking,
  // no keyboard/tab activation, no right-click "copy image" menu.
  function lockDown(btn){
    btn.classList.add("revealed");
    btn.disabled = true;
    btn.setAttribute("aria-disabled", "true");
  }

  buttons.forEach((btn) => {
    const key = btn.getAttribute("data-key");
    const img = btn.querySelector(".side-photo-img");

    // always block drag-out and the right-click context menu on these
    // photos (covers "drag to copy" and "copy image url" at any state)
    btn.addEventListener("contextmenu", (e) => e.preventDefault());
    if (img) {
      img.setAttribute("draggable", "false");
      img.addEventListener("dragstart", (e) => e.preventDefault());
    }

    try {
      if (localStorage.getItem(STORAGE_PREFIX + key) === "1") {
        lockDown(btn);
      }
    } catch (e) { /* localStorage unavailable (e.g. private mode) — stays blurred */ }

    btn.addEventListener("click", () => {
      lockDown(btn);
      try { localStorage.setItem(STORAGE_PREFIX + key, "1"); } catch (e) { /* ignore */ }
    });
  });
})();

/* ---- doodle layer: freehand pen/eraser drawing over the page ----
   Everything drawn lives only in memory until "Save" is tapped; that tap
   is the only moment anything is written to localStorage, so refreshing
   mid-doodle never overwrites a drawing that was saved earlier, and never
   silently saves one that wasn't. Strokes are stored as points relative
   (0–1) to the page's own width/height rather than raw pixels, so a
   drawing stays lined up correctly if the page is measured again at a
   different size (resize, orientation change, content reflow). */
(function(){
  const pageEl = document.getElementById("page");
  const canvas = document.getElementById("doodle-canvas");
  if (!pageEl || !canvas) return;
  const ctx = canvas.getContext("2d");

  const STORAGE_KEY = "notebookDoodles:v1";
  const ERASER_MULT = 3;
  const PEN_TYPES = {
    ballpoint:   { sizeMult:1,   alpha:1,   composite:"source-over", cap:"round"  },
    marker:      { sizeMult:2.2, alpha:1,   composite:"source-over", cap:"round"  },
    highlighter: { sizeMult:3.4, alpha:.35, composite:"multiply",    cap:"square" }
  };

  let strokes = [];
  let redoStack = [];
  let current = null;
  let drawing = false;
  let drawMode = false;
  let activeTool = "pen";
  let penType = "ballpoint";
  let penColor = "#2c3a52";
  let penSize = 4;

  const fab             = document.getElementById("doodle-fab");
  const panel           = document.getElementById("doodle-panel");
  const optionsPanel    = document.getElementById("doodle-options");
  const optionsToggle   = document.getElementById("doodle-options-toggle");
  const toolPenBtn      = document.getElementById("doodle-tool-pen");
  const toolEraserBtn   = document.getElementById("doodle-tool-eraser");
  const undoBtn         = document.getElementById("doodle-undo");
  const redoBtn         = document.getElementById("doodle-redo");
  const clearBtn        = document.getElementById("doodle-clear");
  const editModeBtn     = document.getElementById("doodle-editmode");
  const saveBtn         = document.getElementById("doodle-save");
  const sizeSlider      = document.getElementById("doodle-size");
  const customColorInput= document.getElementById("doodle-custom-color");
  const toast           = document.getElementById("doodle-toast");

  /* ---------- persistence: only touched by loadStrokes() on page load
     and saveStrokes() on a Save click — never on every stroke ---------- */
  function loadStrokes(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) strokes = JSON.parse(raw) || [];
    } catch (e) { strokes = []; }
  }

  let toastTimer;
  function showToast(msg){
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
  }

  function markDirty(isDirty){
    if (saveBtn) saveBtn.classList.toggle("unsaved", isDirty);
  }

  function saveStrokes(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(strokes));
      markDirty(false);
      showToast("Saved to this browser ✓");
    } catch (e) {
      showToast("Couldn't save — storage full or blocked");
    }
  }

  /* ---------- canvas sizing & full redraw ---------- */
  function toPx(pt){
    return { x: pt.x * canvas.clientWidth, y: pt.y * canvas.clientHeight };
  }
  function applyStyle(stroke){
    ctx.globalCompositeOperation = stroke.composite;
    ctx.globalAlpha = stroke.alpha;
    ctx.strokeStyle = stroke.color;
    ctx.lineWidth = stroke.size;
    ctx.lineCap = stroke.cap;
    ctx.lineJoin = "round";
  }
  function resetStyle(){
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  function drawFullStroke(stroke){
    const pts = stroke.points;
    if (pts.length < 2) return;
    applyStyle(stroke);
    ctx.beginPath();
    const p0 = toPx(pts[0]);
    ctx.moveTo(p0.x, p0.y);
    if (pts.length === 2){
      const p1 = toPx(pts[1]);
      ctx.lineTo(p1.x, p1.y);
    } else {
      for (let i = 1; i < pts.length - 1; i++){
        const curr = toPx(pts[i]);
        const next = toPx(pts[i+1]);
        const mid = { x:(curr.x+next.x)/2, y:(curr.y+next.y)/2 };
        ctx.quadraticCurveTo(curr.x, curr.y, mid.x, mid.y);
      }
      const last = toPx(pts[pts.length-1]);
      ctx.lineTo(last.x, last.y);
    }
    ctx.stroke();
    resetStyle();
  }

  function redrawAll(){
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
    strokes.forEach(drawFullStroke);
  }

  /* draws only the first `count` points of a stroke — same path-building
     logic as drawFullStroke, just truncated, so a stroke can be painted
     partway through mid-animation */
  function drawPartialStroke(stroke, count){
    const pts = stroke.points.slice(0, count);
    if (pts.length < 2) return;
    applyStyle(stroke);
    ctx.beginPath();
    const p0 = toPx(pts[0]);
    ctx.moveTo(p0.x, p0.y);
    if (pts.length === 2){
      const p1 = toPx(pts[1]);
      ctx.lineTo(p1.x, p1.y);
    } else {
      for (let i = 1; i < pts.length - 1; i++){
        const curr = toPx(pts[i]);
        const next = toPx(pts[i+1]);
        const mid = { x:(curr.x+next.x)/2, y:(curr.y+next.y)/2 };
        ctx.quadraticCurveTo(curr.x, curr.y, mid.x, mid.y);
      }
      const last = toPx(pts[pts.length-1]);
      ctx.lineTo(last.x, last.y);
    }
    ctx.stroke();
    resetStyle();
  }

  /* Replays a saved set of strokes onto the (already-cleared, already
     visible) canvas over time, as if it were being hand-drawn live —
     used on load to reveal a saved doodle instead of fading it in already
     finished. Paces itself by total point count across all strokes, so a
     bigger drawing takes proportionally longer, clamped to a sane range. */
  function animateDrawIn(strokesToPlay){
    const totalPoints = strokesToPlay.reduce((sum, s) => sum + s.points.length, 0);
    if (totalPoints === 0) return;
    const duration = Math.min(2200, Math.max(900, totalPoints * 5));
    const start = performance.now();

    function frame(now){
      const progress = Math.min(1, (now - start) / duration);
      let pointBudget = Math.floor(progress * totalPoints);

      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.restore();

      for (const stroke of strokesToPlay){
        if (pointBudget <= 0) break;
        const n = Math.min(stroke.points.length, pointBudget);
        drawPartialStroke(stroke, n);
        pointBudget -= stroke.points.length;
      }

      if (progress < 1){
        requestAnimationFrame(frame);
      } else {
        redrawAll(); // guarantees the exact final state, no rounding gaps
      }
    }
    requestAnimationFrame(frame);
  }

  function resizeCanvas(){
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (!w || !h) return;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redrawAll();
  }

  /* redraw whenever the page's own box changes size — strokes are stored
     as fractions of the page, so they land back in the right spot rather
     than stretching or drifting out of place */
  let resizeQueued = false;
  const ro = new ResizeObserver(() => {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(() => { resizeQueued = false; resizeCanvas(); });
  });
  ro.observe(pageEl);

  /* ---------- live stroke drawing ---------- */
  function getPoint(evt){
    return { x: evt.offsetX / canvas.clientWidth, y: evt.offsetY / canvas.clientHeight };
  }

  function presetForPointer(){
    if (activeTool === "eraser"){
      return { color:"#000000", size: penSize * ERASER_MULT, alpha:1, composite:"destination-out", cap:"round" };
    }
    const t = PEN_TYPES[penType] || PEN_TYPES.ballpoint;
    return { color: penColor, size: penSize * t.sizeMult, alpha: t.alpha, composite: t.composite, cap: t.cap };
  }

  function drawLiveSegment(){
    const pts = current.points;
    const n = pts.length;
    if (n < 2) return;
    applyStyle(current);
    ctx.beginPath();
    if (n === 2){
      const p0 = toPx(pts[0]), p1 = toPx(pts[1]);
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
    } else {
      const p0 = toPx(pts[n-3]), p1 = toPx(pts[n-2]), p2 = toPx(pts[n-1]);
      const mid1 = { x:(p0.x+p1.x)/2, y:(p0.y+p1.y)/2 };
      const mid2 = { x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2 };
      ctx.moveTo(mid1.x, mid1.y);
      ctx.quadraticCurveTo(p1.x, p1.y, mid2.x, mid2.y);
    }
    ctx.stroke();
    resetStyle();
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (!drawMode) return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    drawing = true;
    current = Object.assign({ tool: activeTool, points: [getPoint(e)] }, presetForPointer());
    redoStack = [];
    updateHistoryButtons();
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!drawing || !current) return;
    e.preventDefault();
    current.points.push(getPoint(e));
    drawLiveSegment();
  });

  function endStroke(){
    if (!drawing) return;
    drawing = false;
    if (current && current.points.length > 1){
      strokes.push(current);
      markDirty(true);
    }
    current = null;
    updateHistoryButtons();
  }
  canvas.addEventListener("pointerup", endStroke);
  canvas.addEventListener("pointercancel", endStroke);
  canvas.addEventListener("pointerleave", endStroke);

  /* ---------- undo / redo / clear ---------- */
  function updateHistoryButtons(){
    if (undoBtn) undoBtn.disabled = !drawMode || strokes.length === 0;
    if (redoBtn) redoBtn.disabled = !drawMode || redoStack.length === 0;
  }
  function undo(){
    if (!strokes.length) return;
    redoStack.push(strokes.pop());
    markDirty(true);
    redrawAll();
    updateHistoryButtons();
  }
  function redo(){
    if (!redoStack.length) return;
    strokes.push(redoStack.pop());
    markDirty(true);
    redrawAll();
    updateHistoryButtons();
  }
  function clearAll(){
    if (!strokes.length) return;
    /* Keep every erased stroke on the redo stack, in the order it needs
       to come back in, so Erase All can be undone one Redo tap at a
       time — right up until Save makes the erase permanent. */
    redoStack = strokes.slice().reverse();
    strokes = [];
    /* Erasing behaves exactly like drawing a stroke or hitting Undo: it
       only updates the canvas and marks the Save button as having
       unsaved changes — it does NOT write to storage on its own. Tap
       Save afterward to make the erase permanent. */
    markDirty(true);
    redrawAll();
    updateHistoryButtons();
  }

  /* ---------- toolbar wiring ---------- */
  function setTool(tool){
    activeTool = tool;
    if (toolPenBtn){
      toolPenBtn.classList.toggle("active", tool === "pen");
      toolPenBtn.setAttribute("aria-pressed", String(tool === "pen"));
    }
    if (toolEraserBtn){
      toolEraserBtn.classList.toggle("active", tool === "eraser");
      toolEraserBtn.setAttribute("aria-pressed", String(tool === "eraser"));
    }
  }
  if (toolPenBtn) toolPenBtn.addEventListener("click", () => setTool("pen"));
  if (toolEraserBtn) toolEraserBtn.addEventListener("click", () => setTool("eraser"));

  if (undoBtn) undoBtn.addEventListener("click", undo);
  if (redoBtn) redoBtn.addEventListener("click", redo);
  if (clearBtn) clearBtn.addEventListener("click", clearAll);
  if (saveBtn) saveBtn.addEventListener("click", saveStrokes);

  if (optionsToggle){
    optionsToggle.addEventListener("click", () => {
      const willShow = optionsPanel.hidden;
      optionsPanel.hidden = !willShow;
      optionsToggle.setAttribute("aria-expanded", String(willShow));
    });
  }

  document.querySelectorAll(".doodle-pentype").forEach((btn) => {
    btn.addEventListener("click", () => {
      penType = btn.dataset.pentype;
      document.querySelectorAll(".doodle-pentype").forEach((b) => b.classList.toggle("active", b === btn));
    });
  });

  if (sizeSlider){
    penSize = Number(sizeSlider.value) || penSize;
    sizeSlider.addEventListener("input", (e) => { penSize = Number(e.target.value); });
  }

  document.querySelectorAll(".doodle-color[data-color]").forEach((btn) => {
    btn.addEventListener("click", () => {
      penColor = btn.dataset.color;
      document.querySelectorAll(".doodle-color").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
    });
  });
  if (customColorInput){
    customColorInput.addEventListener("input", (e) => {
      penColor = e.target.value;
      document.querySelectorAll(".doodle-color[data-color]").forEach((b) => b.classList.remove("active"));
    });
  }

  /* Edit mode (can the canvas actually be drawn on) is now independent of
     whether the toolbar panel is visible — this button is the one source
     of truth for it, so drawing can keep going after the toolbar closes.
     Every other toolbar control is also locked (greyed out, inert) until
     edit mode is switched on. */
  const lockableEls = [
    toolPenBtn, toolEraserBtn, optionsToggle, clearBtn, saveBtn,
    ...document.querySelectorAll(".doodle-pentype"),
    sizeSlider,
    ...document.querySelectorAll(".doodle-color[data-color]"),
    customColorInput
  ].filter(Boolean);

  function updateToolbarLock(){
    const locked = !drawMode;
    if (panel) panel.classList.toggle("locked", locked);
    if (optionsPanel) optionsPanel.classList.toggle("locked", locked);
    lockableEls.forEach((el) => { el.disabled = locked; });
    updateHistoryButtons();
  }

  function setEditMode(on){
    drawMode = on;
    if (editModeBtn){
      editModeBtn.classList.toggle("active", drawMode);
      editModeBtn.setAttribute("aria-pressed", String(drawMode));
    }
    if (fab){
      fab.classList.toggle("active", drawMode);
      fab.setAttribute("aria-pressed", String(drawMode));
    }
    canvas.classList.toggle("drawing-active", drawMode);
    updateToolbarLock();
  }
  if (editModeBtn){
    editModeBtn.addEventListener("click", () => setEditMode(!drawMode));
  }

  if (fab){
    fab.addEventListener("click", () => {
      const opening = !!panel && panel.hidden;
      if (panel) panel.hidden = !opening;
      fab.setAttribute("aria-expanded", String(opening));
      if (!opening){
        /* Closing the toolbar only hides the toolbar itself — draw mode
           is left exactly as the toggle button set it (untouched here),
           so drawing can carry on with the toolbar tucked away. Also
           tuck away the pen-options sub-panel. */
        if (optionsPanel) optionsPanel.hidden = true;
      }
      /* Opening the toolbar does NOT turn draw mode on — it stays off
         by default until you explicitly tap the edit-mode toggle. */
    });
  }

  /* ---------- init: load whatever was last saved, then size the
     canvas once layout (fonts, images, the dynamically-built link
     grid) has settled ---------- */
  loadStrokes();
  updateToolbarLock();
  markDirty(false);

  /* if there's a saved drawing to show, keep it invisible (but already
     sized and painted, so it's instantly ready) until the whole page —
     images, fonts, everything — has actually finished loading, AND the
     page's own entrance animations (the notebook "settle" tilt-in and
     the staggered card-in fly-ins) have finished playing, then fade it
     in rather than having it pop in already-drawn while the rest of the
     page is still animating on top of it. */
  const hasSavedDrawing = strokes.length > 0;

  requestAnimationFrame(() => requestAnimationFrame(resizeCanvas));

  if (hasSavedDrawing){
    const prefersReducedMotion = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* Resolves once a given element's named CSS animation has finished.
       Falls back to a timeout so the doodle can never get stuck hidden —
       covers reduced-motion (animation:none, so no event ever fires),
       an element that doesn't exist, or any other edge case where
       "animationend" just doesn't arrive. */
    function whenAnimationEnds(el, animationName, fallbackMs){
      return new Promise((resolve) => {
        if (!el || prefersReducedMotion){ resolve(); return; }
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          el.removeEventListener("animationend", onEnd);
          resolve();
        };
        const onEnd = (e) => { if (e.animationName === animationName) finish(); };
        el.addEventListener("animationend", onEnd);
        window.setTimeout(finish, fallbackMs);
      });
    }

    /* Waits for the notebook page's "settle" animation (.7s, no delay)
       and for the LAST card's "card-in" animation to finish — cards are
       staggered by (index * 90ms), so whichever card has the biggest
       --delay is the one that finishes last, regardless of DOM order. */
    function siteEntranceDonePromise(){
      const pageDone = whenAnimationEnds(document.querySelector(".page"), "settle", 900);

      let maxDelay = 0, lastCard = null;
      document.querySelectorAll(".card").forEach((c) => {
        const ms = parseFloat(c.style.getPropertyValue("--delay")) || 0;
        if (ms >= maxDelay){ maxDelay = ms; lastCard = c; }
      });
      const cardsDone = whenAnimationEnds(lastCard, "card-in", maxDelay + 700);

      return Promise.all([pageDone, cardsDone]);
    }

    const windowLoadPromise = document.readyState === "complete"
      ? Promise.resolve()
      : new Promise((resolve) => window.addEventListener("load", resolve, { once:true }));

    Promise.all([windowLoadPromise, siteEntranceDonePromise()]).then(() => {
      resizeCanvas(); // layout may have shifted further while loading
      window.setTimeout(() => {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          if (prefersReducedMotion){
            /* respect reduced motion: just show the finished drawing,
               no fade and no stroke-by-stroke replay */
            canvas.classList.add("doodle-revealed");
            return;
          }
          /* clear what resizeCanvas() just painted, reveal the (now
             blank) canvas instantly, then replay every saved stroke on
             top of it so the drawing appears to draw itself in, pen
             stroke by pen stroke, instead of fading in already-done */
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.restore();
          canvas.classList.add("doodle-revealed");
          animateDrawIn(strokes);
        }));
      }, 500);
    });
  } else {
    /* nothing saved to fade in — just make the (currently empty) canvas
       usable right away so live drawing isn't blocked behind opacity:0 */
    canvas.classList.add("doodle-revealed");
  }
})();

/* ---- draggable doodle button: the FAB (and the toolbar it opens) can be
   dragged anywhere on screen. The very first time anyone opens the page
   it sits in its normal spot (bottom-center, set by CSS) — only once it's
   been dragged does a custom position get remembered, per browser, as a
   fraction of the viewport so it still lands somewhere sensible after a
   resize or orientation change. The dock is sized to exactly match the
   button (see CSS), and the toolbar lives in its own separately-anchored
   wrapper, centered on the button whenever there's room.

   Keeping the open toolbar on-screen: the BUTTON never moves to make room
   for the toolbar — it stays exactly where it was dropped. Instead, when
   the toolbar (or the pen-options sub-panel) would be cut off — because
   the button is sitting near a screen edge — the TOOLBAR itself is
   nudged sideways (and/or vertically) just far enough to stay fully
   visible, while remaining anchored to the button. No animation, no
   resizing — it simply sticks to the nearest position that keeps it
   on-screen. See positionToolbarWrap. ---- */
(function(){
  const dock        = document.getElementById("doodle-dock");
  const fab          = document.getElementById("doodle-fab");
  const wrap         = document.getElementById("doodle-toolbar-wrap");
  const panel        = document.getElementById("doodle-panel");
  const optionsPanel = document.getElementById("doodle-options");
  if (!dock || !fab) return;

  const STORAGE_KEY   = "doodleDockPos:v1";
  const DRAG_THRESHOLD = 6;   // px of movement before a tap counts as a drag
  const MARGIN         = 18;  // keep the button at least this far from any edge — its own visible border-zone it can't be dragged past

  let dragging  = false;
  let moved     = false;
  let pointerId = null;
  let startX = 0, startY = 0, startLeft = 0, startTop = 0;

  function clamp(val, min, max){ return Math.min(Math.max(val, min), max); }

  function applyPosition(left, top){
    const w = dock.offsetWidth  || 52;
    const h = dock.offsetHeight || 52;
    const maxLeft = Math.max(MARGIN, window.innerWidth  - w - MARGIN);
    const maxTop  = Math.max(MARGIN, window.innerHeight - h - MARGIN);
    left = clamp(left, MARGIN, maxLeft);
    top  = clamp(top, MARGIN, maxTop);
    dock.style.left = left + "px";
    dock.style.top = top + "px";
    dock.style.bottom = "auto";
    dock.style.transform = "none";
    return { left, top };
  }

  function savePosition(left, top){
    try {
      const fx = (left + dock.offsetWidth  / 2) / window.innerWidth;
      const fy = (top  + dock.offsetHeight / 2) / window.innerHeight;
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ fx, fy }));
    } catch (e) { /* ignore — position just won't be remembered */ }
  }

  function restorePosition(){
    let saved = null;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) saved = JSON.parse(raw);
    } catch (e) { /* ignore */ }
    if (!saved || typeof saved.fx !== "number" || typeof saved.fy !== "number") return;
    requestAnimationFrame(() => {
      const left = saved.fx * window.innerWidth  - dock.offsetWidth  / 2;
      const top  = saved.fy * window.innerHeight - dock.offsetHeight / 2;
      applyPosition(left, top);
      updateFlip();
    });
  }

  /* Positions the toolbar wrapper relative to the button: centered
     horizontally on it by default, but nudged left/right (via `left`) and,
     separately, up/down (via a `translateY` transform) just enough to keep
     it fully on-screen when the button is sitting close to an edge. The
     button's own position is never touched here — only the toolbar moves.
     Runs whenever the toolbar opens/closes, whenever the pen-options
     sub-panel changes the toolbar's size, and while the button is being
     dragged with the toolbar open. */
  function positionToolbarWrap(){
    const toolbarOpen = panel && !panel.hidden;
    const optionsOpen = optionsPanel && !optionsPanel.hidden;
    if (!toolbarOpen && !optionsOpen){
      wrap.style.left = "";
      wrap.style.transform = "";
      return;
    }

    const dockRect = dock.getBoundingClientRect();
    const wrapWidth = wrap.offsetWidth;

    // default: dead-centered on the button
    let left = (dockRect.width - wrapWidth) / 2;
    const pageLeft  = dockRect.left + left;
    const pageRight = pageLeft + wrapWidth;
    if (pageLeft < MARGIN) left += (MARGIN - pageLeft);
    else if (pageRight > window.innerWidth - MARGIN) left -= (pageRight - (window.innerWidth - MARGIN));
    wrap.style.left = left + "px";

    // vertical: measure where it actually landed (after the flip-up/down
    // rule + the left shift above) and nudge with translateY if it's still
    // poking off the top or bottom edge
    const rect = wrap.getBoundingClientRect();
    let dy = 0;
    if (rect.top < MARGIN) dy = MARGIN - rect.top;
    else if (rect.bottom > window.innerHeight - MARGIN) dy = (window.innerHeight - MARGIN) - rect.bottom;
    wrap.style.transform = dy !== 0 ? `translateY(${dy}px)` : "";
  }

  /* if the button ends up near the top of the screen, the toolbar (which
     opens upward, above the button) may not have room to fit — flip it to
     open downward instead so it's never cut off or pushed off-screen */
  function updateFlip(){
    if (!wrap) return;
    const toolbarOpen  = panel && !panel.hidden;
    const optionsOpen  = optionsPanel && !optionsPanel.hidden;
    if (!toolbarOpen && !optionsOpen){
      positionToolbarWrap();
      return;
    }
    requestAnimationFrame(() => {
      const dockRect  = dock.getBoundingClientRect();
      const wrapHeight = wrap.getBoundingClientRect().height;
      const gap = 10;
      wrap.classList.toggle("flip-down", wrapHeight + gap > dockRect.top);
      requestAnimationFrame(positionToolbarWrap);
    });
  }
  const visibilityObserver = new MutationObserver(updateFlip);
  if (panel) visibilityObserver.observe(panel, { attributes:true, attributeFilter:["hidden"] });
  if (optionsPanel) visibilityObserver.observe(optionsPanel, { attributes:true, attributeFilter:["hidden"] });

  fab.addEventListener("pointerdown", (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    dragging = true;
    moved = false;
    pointerId = e.pointerId;
    const rect = dock.getBoundingClientRect();
    startLeft = rect.left;
    startTop  = rect.top;
    startX = e.clientX;
    startY = e.clientY;
    try { fab.setPointerCapture(pointerId); } catch (err) { /* ignore */ }
  });

  fab.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (!moved && Math.hypot(dx, dy) > DRAG_THRESHOLD){
      moved = true;
      dock.classList.add("dragging");
      fab.classList.add("dragging");
    }
    if (!moved) return;
    e.preventDefault();
    applyPosition(startLeft + dx, startTop + dy);
    // keep the toolbar glued to (and fully on-screen relative to) the
    // button in real time, in case it's open while being dragged
    positionToolbarWrap();
  });

  function endDrag(){
    if (!dragging) return;
    dragging = false;
    try { if (pointerId !== null) fab.releasePointerCapture(pointerId); } catch (err) { /* ignore */ }
    dock.classList.remove("dragging");
    fab.classList.remove("dragging");
    if (moved){
      const rect = dock.getBoundingClientRect();
      savePosition(rect.left, rect.top);
      updateFlip();
    }
  }
  fab.addEventListener("pointerup", endDrag);
  fab.addEventListener("pointercancel", endDrag);

  /* a drag ends with a click event right after pointerup — swallow that
     one click so dropping the button doesn't also toggle the toolbar */
  fab.addEventListener("click", (e) => {
    if (moved){
      e.preventDefault();
      e.stopImmediatePropagation();
      moved = false;
    }
  }, true);

  window.addEventListener("resize", () => { restorePosition(); updateFlip(); }, { passive:true });

  restorePosition();
})();
</script>
</body>
</html>
