<script>
/* Hold the page hidden (see the html:not(.fonts-ready) rule below) until
   the actual webfonts have finished loading, so nothing ever flashes in
   the browser's fallback font first. A short timeout is a safety net in
   case a font request stalls, so the page never stays hidden forever. */
(function(){
  function reveal(){
    document.documentElement.classList.add("fonts-ready");
    window.dispatchEvent(new Event("page-reveal"));
  }
  if (document.fonts && document.fonts.ready){
    Promise.race([
      Promise.all([
        document.fonts.load('700 1em Caveat'),
        document.fonts.load('600 1em Caveat'),
        document.fonts.load('400 1em "Patrick Hand"'),
        document.fonts.load('400 1em "Special Elite"')
      ]).then(function(){ return document.fonts.ready; }),
      new Promise(function(resolve){ setTimeout(resolve, 3000); })
    ]).then(reveal, reveal);
  } else {
    reveal();
  }
})();
</script>

<style>
  :root{
    --paper:#f7f2e6;
    --paper-edge:#ece2cc;
    --desk:#b7ab93;
    --ink:#2c3a52;
    --ink-soft:#54617c;
    --rule:#b9cae7;
    --margin:#cf7972;
    --tape-yellow:#f2d98a;
    --tape-pink:#eeb7c3;
    --tape-mint:#b6d8c8;
    --string:#e0601e;
    --shadow:rgba(35,30,20,.28);
    --font-display:'Caveat',cursive;
    --font-hand:'Patrick Hand',cursive;
    --font-type:'Special Elite',monospace;

    /* ink as raw r,g,b so it can be tinted with alpha elsewhere (rgba(var(--ink-rgb),x)) —
       keeps overlays/blur tints tied to the theme instead of hardcoded colors */
    --ink-rgb:44,58,82;
    /* base blur strength for the hidden side photos; scales up on wider
       viewports (see media queries below) so it stays proportionate to the
       bigger photo frames instead of looking under/over-blurred */
    --photo-blur:9px;
  }

  @media (min-width:760px){
    :root{ --photo-blur:11px; }
  }
  @media (min-width:1100px){
    :root{ --photo-blur:13px; }
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  /* keep the page invisible until the "fonts-ready" class above lands, so
     the very first paint already has the real webfonts — no fallback-font
     flash while Caveat / Patrick Hand / Special Elite finish loading */
  html:not(.fonts-ready){ visibility:hidden; }
  html.fonts-ready{ visibility:visible; }

  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.10), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(0,0,0,.10), transparent 50%),
      var(--desk);
    display:flex;
    justify-content:center;
    padding:48px 16px 80px;
    font-family:var(--font-hand);
    color:var(--ink);
  }

  /* ============ THE NOTEBOOK PAGE ============ */
  .page{
    position:relative;
    width:100%;
    max-width:640px;
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(to bottom, var(--rule) 0, var(--rule) 1px, transparent 1px, transparent 34px),
      radial-gradient(circle at 25% 20%, rgba(0,0,0,.025), transparent 40%),
      radial-gradient(circle at 80% 75%, rgba(0,0,0,.03), transparent 45%);
    padding:38px 26px 34px 92px;
    border-radius:2px;
    box-shadow:0 18px 40px var(--shadow), 0 3px 8px rgba(0,0,0,.15);
    transform:rotate(-0.6deg);
    animation:settle .7s ease-out;
    transition:max-width .2s ease;
  }
  @keyframes settle{
    from{opacity:0; transform:rotate(-0.6deg) translateY(14px);}
    to{opacity:1; transform:rotate(-0.6deg) translateY(0);}
  }

  /* ============ CUSTOM SCROLLBAR (theme-matched) ============ */
  html{
    scrollbar-width:thin;
    scrollbar-color:var(--margin) var(--desk);
  }
  ::-webkit-scrollbar{ width:16px; }
  ::-webkit-scrollbar-track{
    background:var(--desk);
    border-left:1px solid rgba(0,0,0,.15);
  }
  ::-webkit-scrollbar-thumb{
    background-color:var(--margin);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M7 12V6a4 4 0 0 1 8 0v9a2.5 2.5 0 0 1-5 0V8' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position:center;
    background-size:10px 10px;
    border-radius:9px;
    border:3px solid var(--desk);
    background-clip:padding-box;
  }
  ::-webkit-scrollbar-thumb:hover{ background-color:var(--ink); }

  /* ============ SCROLL POSITION NOTE ============ */
  .scroll-note{
    position:fixed;
    top:50%;
    right:26px;
    transform:translateY(-50%) translateX(14px) rotate(-3deg);
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--tape-yellow);
    color:var(--ink);
    font-family:var(--font-display);
    font-weight:700;
    font-size:19px;
    line-height:1;
    padding:7px 14px 8px 10px;
    border-radius:3px;
    box-shadow:0 4px 10px rgba(35,30,20,.25);
    opacity:0;
    pointer-events:none;
    z-index:50;
    transition:opacity .25s ease, transform .25s ease, top .12s linear;
    white-space:nowrap;
  }
  .scroll-note::before{
    content:"";
    position:absolute;
    top:-8px; left:14px;
    width:26px; height:14px;
    background:var(--tape-pink);
    opacity:.85;
    transform:rotate(-6deg);
    mix-blend-mode:multiply;
  }
  .scroll-note.visible{
    opacity:1;
    transform:translateY(-50%) translateX(0) rotate(-2deg);
  }
  .scroll-note-pin{ width:16px; height:16px; flex-shrink:0; color:var(--ink); }
  .scroll-note-pin svg{ width:100%; height:100%; }
  .scroll-note-pin path{ fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }

  @media (max-width:480px){
    .scroll-note{ right:10px; font-size:16px; padding:6px 10px 7px 8px; }
  }
  @media (prefers-reduced-motion: reduce){
    .scroll-note{ transition:opacity .01ms; }
  }

  /* folded corner, top right */
  .page::before{
    content:"";
    position:absolute;
    top:0; right:0;
    width:0; height:0;
    border-style:solid;
    border-width:0 30px 30px 0;
    border-color:transparent var(--paper-edge) transparent transparent;
    filter:drop-shadow(-2px 2px 2px rgba(0,0,0,.18));
  }

  /* spiral-bound holes, left edge */
  .holes{
    position:absolute;
    left:16px; top:18px; bottom:18px;
    width:20px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
  }
  .hole{
    width:14px; height:14px;
    border-radius:50%;
    background:var(--desk);
    box-shadow:inset 0 2px 3px rgba(0,0,0,.35);
    flex-shrink:0;
  }

  /* red margin rule */
  .margin-line{
    position:absolute;
    top:0; bottom:0; left:62px;
    width:2px;
    background:var(--margin);
    opacity:.55;
  }

  /* ============ HEADER ============ */
  .page-head{ text-align:center; padding-top:4px; max-width:480px; margin:0 auto; }

  .polaroid{
    position:relative;
    z-index:2;
    width:150px;
    margin:0 auto 6px;
    background:#fffdf8;
    padding:10px 10px 26px;
    box-shadow:0 8px 16px rgba(0,0,0,.22);
    transform:rotate(-4deg);
  }

  /* ============ PHOTO CLUSTER: side photos + connecting string ============ */
  .photo-cluster{
    position:relative;
    width:150px;
    margin:0 auto;
  }
  /* ---- side photos: torn-paper edges instead of a clean frame ----
     Each side has its own jagged clip-path "rip" pattern (so the two
     don't match each other, same as a real torn edge wouldn't) and no
     drawn border — the ragged silhouette itself is the edge. Shadow
     uses filter:drop-shadow instead of box-shadow so it follows the
     torn outline rather than sitting behind it as a plain rectangle. */
  /* ---- wrapper: holds position/size/rotation for a side photo. Left
     unclipped (no overflow, no clip-path) so the tape seal — a child of
     this wrapper, not of the button below — can hang half above the
     torn photo instead of being cut off by its jagged top edge. ---- */
  .photo-slot{
    display:none;
    position:absolute;
    z-index:1;
    margin:0;
    padding:0;
  }
  .photo-slot-left{
    width:104px; height:104px;
    right:calc(100% + 30px);
    top:54px;
    transform:rotate(-6deg);
  }
  .photo-slot-right{
    width:126px; height:112px;
    left:calc(100% + 30px);
    top:100px;
    transform:rotate(5deg);
  }
  .side-photo{
    display:block;
    position:absolute;
    inset:0;
    width:100%; height:100%;
    margin:0;
    padding:0;
    background:var(--paper);
    border:none;
    overflow:hidden;
    filter:drop-shadow(0 6px 10px rgba(35,30,20,.32));
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
  }
  .side-photo:focus-visible{
    outline:2px dashed var(--ink);
    outline-offset:3px;
  }
  .side-photo-left{
    clip-path:polygon(0% 0%, 20% 1.5%, 40% -5.5%, 60% 8.4%, 80% 7.6%, 100% 0%, 99.4% 20%, 102.9% 40%, 94.9% 60%, 95% 80%, 100% 100%, 80% 96.2%, 60% 103.5%, 40% 94.8%, 20% 108.5%, 0% 100%, -7.7% 80%, -5.5% 60%, -7.4% 40%, 4.9% 20%);
  }
  .side-photo-right{
    clip-path:polygon(0% 0%, 20% 4.7%, 40% 2.6%, 60% -1.6%, 80% -5.4%, 100% 0%, 103.2% 20%, 108.4% 40%, 98.7% 60%, 106.3% 80%, 100% 100%, 80% 91.6%, 60% 100.5%, 40% 94.6%, 20% 99.9%, 0% 100%, 2% 80%, 6.4% 60%, 0.4% 40%, 6.6% 20%);
  }
  .side-photo-img{
    display:none;
    width:100%; height:100%;
    object-fit:cover;
    filter:blur(var(--photo-blur)) saturate(.9);
    transform:scale(1.12);
    transition:filter .5s ease, transform .5s ease;
    -webkit-user-drag:none;
    user-select:none;
    -webkit-touch-callout:none; /* blocks the iOS long-press "Save Image" menu */
  }
  .side-photo.revealed .side-photo-img{
    filter:blur(0) saturate(1);
    transform:scale(1);
  }
  /* ---- blur wanders while a side photo is still hidden, instead of
     sitting at one fixed strength — makes the disguise feel alive
     rather than a flat frosted pane. Irregular keyframe stops (not an
     even 25/50/75 split) avoid a metronome feel, and each side runs
     its own duration + a negative delay so they're never in step. ---- */
  .side-photo.has-photo:not(.revealed) .side-photo-img{
    animation:blurDrift 8s ease-in-out infinite;
  }
  .side-photo-right.has-photo:not(.revealed) .side-photo-img{
    animation-duration:10.5s;
    animation-delay:-4.2s;
  }
  @keyframes blurDrift{
    0%   { filter:blur(calc(var(--photo-blur) * .7))  saturate(.82); }
    17%  { filter:blur(calc(var(--photo-blur) * 1.2)) saturate(.95); }
    33%  { filter:blur(calc(var(--photo-blur) * .55)) saturate(.78); }
    52%  { filter:blur(calc(var(--photo-blur) * 1.35)) saturate(1); }
    68%  { filter:blur(calc(var(--photo-blur) * .9))  saturate(.86); }
    84%  { filter:blur(calc(var(--photo-blur) * 1.1)) saturate(.9); }
    100% { filter:blur(calc(var(--photo-blur) * .7))  saturate(.82); }
  }
  /* once revealed the button has done its job: kill click, hover and
     right-click/long-press targeting so the photo can't be re-triggered,
     dragged out, or "copy image"/"copy image address"-d from the menu */
  .side-photo.revealed{
    cursor:default;
    pointer-events:none;
  }

  /* ---- fallback doodle shown when a side photo has no image ---- */
  .side-photo-fallback{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink-soft);
  }
  .side-photo-fallback svg{ width:56%; height:56%; }
  .side-photo-fallback path,
  .side-photo-fallback circle{
    fill:none;
    stroke:currentColor;
    stroke-width:2.6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  /* once a real photo loads, has-photo is added and the doodle steps aside */
  .side-photo.has-photo .side-photo-fallback{ display:none; }
  /* ---- slow liquid color blend hiding a loaded-but-unrevealed photo ----
     Sits on top of the (still blurred) img so nothing in the picture is
     recognizable pre-reveal. Colors come straight from the theme palette.
     Two blob layers drift at different speeds/directions so the blend
     feels alive rather than a single loop repeating in place. */
  .side-photo-liquid{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    background:var(--paper-edge);
    opacity:1;
    transition:opacity .6s ease;
  }
  .side-photo-liquid::before,
  .side-photo-liquid::after{
    content:"";
    position:absolute;
    inset:-30%;
    filter:blur(20px) saturate(1.2);
  }
  .side-photo-liquid::before{
    background:
      radial-gradient(circle at 22% 28%, var(--tape-pink)   0%, transparent 52%),
      radial-gradient(circle at 76% 18%, var(--tape-mint)   0%, transparent 52%),
      radial-gradient(circle at 30% 78%, var(--tape-yellow) 0%, transparent 52%),
      radial-gradient(circle at 82% 74%, var(--string)      0%, transparent 50%),
      radial-gradient(circle at 52% 50%, var(--margin)      0%, transparent 58%);
    animation:liquidDriftA 9s ease-in-out infinite alternate;
  }
  .side-photo-liquid::after{
    mix-blend-mode:soft-light;
    background:
      radial-gradient(circle at 68% 30%, var(--tape-yellow) 0%, transparent 48%),
      radial-gradient(circle at 20% 62%, var(--string)      0%, transparent 50%),
      radial-gradient(circle at 60% 84%, var(--tape-pink)   0%, transparent 52%),
      radial-gradient(circle at 88% 90%, var(--tape-mint)   0%, transparent 46%);
    animation:liquidDriftB 6.5s ease-in-out infinite alternate;
  }
  .side-photo:not(.has-photo) .side-photo-liquid{ display:none; }
  .side-photo.revealed .side-photo-liquid{ opacity:0; }
  @keyframes liquidDriftA{
    0%   { transform:translate(-5%,-3%) scale(1.05) rotate(0deg);   filter:blur(20px) saturate(1.2) hue-rotate(0deg); }
    20%  { transform:translate(4%,3%)   scale(1.14) rotate(8deg);   filter:blur(22px) saturate(1.25) hue-rotate(6deg); }
    45%  { transform:translate(-3%,5%)  scale(1.08) rotate(-6deg);  filter:blur(19px) saturate(1.15) hue-rotate(-5deg); }
    70%  { transform:translate(5%,-4%)  scale(1.18) rotate(5deg);   filter:blur(23px) saturate(1.3)  hue-rotate(4deg); }
    100% { transform:translate(-4%,2%)  scale(1.06) rotate(-4deg);  filter:blur(20px) saturate(1.2)  hue-rotate(-3deg); }
  }
  @keyframes liquidDriftB{
    0%   { transform:translate(4%,-4%)  scale(1.1)  rotate(0deg); }
    30%  { transform:translate(-5%,3%)  scale(1.2)  rotate(-10deg); }
    55%  { transform:translate(3%,5%)   scale(1.05) rotate(7deg); }
    80%  { transform:translate(-3%,-5%) scale(1.15) rotate(-6deg); }
    100% { transform:translate(5%,2%)   scale(1.1)  rotate(9deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .side-photo-liquid::before,
    .side-photo-liquid::after{ animation:none; }
    .side-photo-img{ animation:none; }
  }
  .string-doodle{ display:none; }
  @media (min-width:760px){
    .photo-slot{ display:block; }
    /* the right torn photo now hangs lower than the cluster's own
       height (set by the polaroid) — extra clearance keeps it from
       overlapping the name/subtitle text below. */
    .photo-cluster{ margin-bottom:52px; }
  }
  /* ---- washi-tape seals on the side photos (same idea as .tape on the
     main polaroid, in the cluster's other two accent colors) ---- */
  .side-tape{
    position:absolute;
    top:-8px; left:50%;
    width:40px; height:16px;
    opacity:.8;
    mix-blend-mode:multiply;
    pointer-events:none;
    z-index:2;
  }
  .side-tape-left{ background:var(--tape-pink); transform:translateX(-50%) rotate(-9deg); }
  .side-tape-right{ background:var(--tape-mint); transform:translateX(-50%) rotate(8deg); }
  .tape{
    position:absolute;
    top:-12px; left:50%;
    width:64px; height:22px;
    background:var(--tape-yellow);
    opacity:.8;
    transform:translateX(-50%) rotate(-4deg);
    mix-blend-mode:multiply;
  }
  .photo-frame{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    background:#eee6d4;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .profile-photo{
    display:none;
    width:100%; height:100%;
    object-fit:cover;
    -webkit-user-drag:none;
    user-select:none;
    -webkit-touch-callout:none; /* blocks the iOS long-press "Save Image" menu */
  }
  .avatar{ width:78%; height:78%; color:var(--ink-soft); }
  .avatar path,.avatar circle{ fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .avatar .fill{ fill:currentColor; stroke:none; }
  .polaroid-caption{
    position:absolute; bottom:4px; left:0; right:0;
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    margin:0;
  }

  .title{
    position:relative;
    display:inline-block;
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(46px,10vw,64px);
    margin:10px 0 0;
    line-height:1;
  }
  .title-link{
    color:inherit;
    text-decoration:none;
    transition:color .18s ease;
  }
  .title-link:hover, .title-link:focus-visible{
    color:var(--margin);
  }
  .title-link:focus-visible{
    outline:2px dashed var(--ink);
    outline-offset:6px;
    border-radius:6px;
  }
  .underline-doodle{
    display:block;
    width:100%; height:14px;
    margin-top:-4px;
  }
  .underline-doodle svg{ width:100%; height:100%; overflow:visible; }
  .underline-doodle path{ fill:none; stroke:var(--margin); stroke-width:3; stroke-linecap:round; }

  .subtitle{
    font-size:18px;
    color:var(--ink-soft);
    margin:10px auto 4px;
    max-width:38ch;
  }
  .typed-hint{
    font-family:var(--font-type);
    font-size:12px;
    letter-spacing:.03em;
    color:var(--ink-soft);
    opacity:.75;
    margin:2px 0 0;
  }

  .rule-break{
    border:none;
    border-top:2px dashed rgba(44,58,82,.25);
    margin:26px 0;
  }

  /* ============ SECTION HEADINGS ============ */
  .link-group + .link-group{ margin-top:32px; }
  .section-heading{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--font-display);
    font-weight:700;
    font-size:30px;
    margin:0 0 16px;
    color:var(--ink);
  }
  .section-heading .star{
    color:var(--margin);
    font-size:19px;
    display:inline-block;
    transform:rotate(-10deg);
  }
  .section-heading::after{
    content:"";
    flex:1;
    border-top:1.5px dashed rgba(44,58,82,.3);
    margin-left:6px;
  }

  /* ============ LINK CARDS ============ */
  .links-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:22px;
  }

  .card{
    position:relative;
    padding:16px 18px 44px;
    background:#fffdf8;
    border:1.5px solid rgba(44,58,82,.35);
    border-radius:10px 13px 9px 12px / 12px 9px 14px 8px;
    box-shadow:0 4px 0 rgba(0,0,0,.05), 0 6px 14px rgba(35,30,20,.12);
    transform:rotate(var(--rot,0deg));
    opacity:0;
    animation:card-in .5s ease-out forwards;
    animation-delay:var(--delay,0ms);
    transition:transform .22s ease, box-shadow .22s ease;
  }
  @keyframes card-in{
    from{ opacity:0; transform:rotate(var(--rot,0deg)) translateY(10px); }
    to{ opacity:1; transform:rotate(var(--rot,0deg)) translateY(0); }
  }
  .card:hover, .card:focus-within{
    transform:rotate(0deg) translateY(-4px);
    box-shadow:0 4px 0 rgba(0,0,0,.05), 0 14px 22px rgba(35,30,20,.20);
  }

  .tape-piece{
    position:absolute;
    top:-11px; left:50%;
    width:58px; height:20px;
    background:var(--tape,var(--tape-yellow));
    opacity:.85;
    transform:translateX(-50%) rotate(-3deg);
    mix-blend-mode:multiply;
    pointer-events:none;
  }

  .card-link{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    color:inherit;
    text-decoration:none;
  }
  .card-link:focus-visible{
    outline:2px dashed var(--ink);
    outline-offset:4px;
    border-radius:6px;
  }

  .card-icon{ flex-shrink:0; width:40px; height:40px; color:var(--ink); }
  .card-arrow{ flex-shrink:0; width:20px; height:20px; color:var(--ink-soft); transition:transform .22s ease, color .22s ease; }
  .copy-icon{ width:16px; height:16px; display:block; }

  /* ---- little QR square, taped on like a Polaroid corner ----
     background uses the card's own --tape colour (yellow/pink/mint,
     cycled per card — same swatch as the tape-piece above it) instead
     of flat paper, so each QR reads as a themed sticky-swatch. It's
     also a real click target now (opens the enlarge modal below), so
     it gets its own cursor, focus ring and hover lift. */
  .card-qr{
    flex-shrink:0;
    width:52px; height:52px;
    padding:5px;
    background:var(--tape, var(--paper));
    border:1.5px dashed rgba(44,58,82,.4);
    border-radius:7px;
    transform:rotate(var(--qr-rot,-3deg));
    box-shadow:0 2px 5px rgba(35,30,20,.14);
    transition:transform .22s ease, border-color .22s ease, box-shadow .22s ease, filter .18s ease;
    cursor:zoom-in;
  }
  .card-qr svg{ width:100%; height:100%; display:block; }
  .card-qr svg rect{ fill:var(--ink); }
  .card:hover .card-qr, .card:focus-within .card-qr{
    transform:rotate(0deg) scale(1.06);
    border-color:var(--margin);
    box-shadow:0 4px 9px rgba(35,30,20,.2);
  }
  .card-qr:hover, .card-qr:focus-visible{ filter:brightness(1.06); }
  .card-qr:focus-visible{
    outline:2px dashed var(--ink);
    outline-offset:3px;
  }

  .card-icon svg, .card-arrow svg, .copy-icon svg{ width:100%; height:100%; }
  .card-icon path, .card-icon circle, .card-icon rect,
  .card-arrow path, .card-arrow circle, .card-arrow rect,
  .copy-icon path, .copy-icon circle, .copy-icon rect{
    fill:none; stroke:currentColor; stroke-width:2.3;
    stroke-linecap:round; stroke-linejoin:round;
  }
  .card-icon .fill, .card-arrow .fill, .copy-icon .fill{ fill:currentColor; stroke:none; }

  .card:hover .card-arrow, .card:focus-within .card-arrow{ transform:rotate(45deg) translate(2px,-2px); color:var(--margin); }

  .card-text{ display:flex; flex-direction:column; min-width:0; flex:1; }
  .card-label{
    position:relative;
    display:inline-block;
    width:fit-content;
    font-family:var(--font-display);
    font-weight:700;
    font-size:26px;
    line-height:1;
  }
  .ink-underline{
    position:absolute; left:0; bottom:-3px;
    height:2px; width:0;
    background:var(--margin);
    transition:width .25s ease;
  }
  .card:hover .ink-underline, .card:focus-within .ink-underline{ width:100%; }

  .card-handle{
    font-family:var(--font-type);
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .card-note{
    font-size:15px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  /* ---- copy-link button ---- */
  .copy-btn{
    position:absolute;
    bottom:8px; right:12px;
    width:30px; height:30px;
    border-radius:50%;
    border:1.5px dashed rgba(44,58,82,.4);
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
    cursor:pointer;
    padding:0;
    transition:background .2s ease, color .2s ease, transform .15s ease, border-color .2s ease;
    font-family:var(--font-hand);
  }
  .copy-btn:hover{
    background:rgba(44,58,82,.08);
    color:var(--ink);
    border-color:var(--ink);
    transform:scale(1.08);
  }
  .copy-btn:focus-visible{
    outline:2px dashed var(--ink);
    outline-offset:3px;
  }
  .copy-btn.just-copied{
    color:#3f7a5c;
    border-color:#3f7a5c;
  }
  .copy-toast{
    position:absolute;
    bottom:38px; right:0;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--font-type);
    font-size:11px;
    padding:4px 9px;
    border-radius:4px;
    white-space:nowrap;
    opacity:0;
    transform:translateY(4px);
    transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
  }
  .copy-toast.show{ opacity:1; transform:translateY(0); }

  /* ============ FOOTER ============ */
  .page-foot{ text-align:center; margin-top:6px; }
  .footnote{
    font-family:var(--font-type);
    font-size:12px;
    color:var(--ink-soft);
    opacity:.7;
  }

  /* ============ DESKTOP: wider page, two-column grid ============ */
  @media (min-width:760px){
    .page{ max-width:940px; }
    .links-grid{ grid-template-columns:1fr 1fr; gap:24px 28px; }
  }

  /* ============ MOBILE ============ */
  @media (max-width:480px){
    .page{ padding:32px 18px 28px 66px; }
    .holes{ left:10px; width:14px; }
    .hole{ width:10px; height:10px; }
    .margin-line{ left:42px; }
    .title{ font-size:clamp(38px,13vw,52px); }
    .card{ padding:12px 14px 40px; }
    .card-icon{ width:34px; height:34px; }
    .card-qr{ width:42px; height:42px; padding:4px; }
    .card-label{ font-size:23px; }
    .section-heading{ font-size:26px; }
  }

  @media (prefers-reduced-motion: reduce){
    .page, .card{ animation:none !important; opacity:1 !important; transform:rotate(var(--rot,0deg)) !important; }
    .card-icon path,.card-icon circle,.card-icon rect{ stroke-dashoffset:0 !important; }
  }

  /* ============ QR ENLARGE MODAL ============
     Tapping a card's little QR square pops this up with a much bigger,
     easier-to-scan version — background tinted to match that card's
     own tape swatch, so it still reads as "the same QR, just bigger". */
  .qr-modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(var(--ink-rgb),.55);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:1000;
    opacity:0;
    visibility:hidden;
    transition:opacity .22s ease, visibility 0s linear .22s;
  }
  .qr-modal-overlay.open{
    opacity:1;
    visibility:visible;
    transition:opacity .22s ease, visibility 0s;
  }
  .qr-modal{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    width:100%;
    max-width:300px;
    background:var(--paper);
    border-radius:4px;
    padding:36px 24px 24px;
    box-shadow:0 20px 44px rgba(0,0,0,.35), 0 4px 10px rgba(0,0,0,.2);
    transform:scale(.85) rotate(-1.1deg);
    transition:transform .26s cubic-bezier(.22,.9,.32,1.28);
  }
  .qr-modal-overlay.open .qr-modal{ transform:scale(1) rotate(-1.1deg); }
  .qr-modal-tape{
    position:absolute;
    top:-12px; left:50%;
    width:66px; height:22px;
    background:var(--tape-yellow);
    opacity:.85;
    transform:translateX(-50%) rotate(-2deg);
    mix-blend-mode:multiply;
    pointer-events:none;
  }
  .qr-modal-close{
    position:absolute;
    top:6px; right:6px;
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; padding:0;
    color:var(--ink-soft);
    border-radius:50%;
    cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  .qr-modal-close svg{ width:16px; height:16px; }
  .qr-modal-close path{ fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; }
  .qr-modal-close:hover, .qr-modal-close:focus-visible{
    background:rgba(var(--ink-rgb),.08);
    color:var(--ink);
    outline:none;
  }
  /* download button — mirrors the close button, top-left corner */
  .qr-modal-download{
    position:absolute;
    top:6px; left:6px;
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; padding:0;
    color:var(--ink-soft);
    border-radius:50%;
    cursor:pointer;
    transition:background .18s ease, color .18s ease, opacity .18s ease;
  }
  .qr-modal-download svg{ width:17px; height:17px; }
  .qr-modal-download path{ fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .qr-modal-download:hover, .qr-modal-download:focus-visible{
    background:rgba(var(--ink-rgb),.08);
    color:var(--ink);
    outline:none;
  }
  .qr-modal-download.is-busy{
    opacity:.5;
    cursor:wait;
    pointer-events:none;
  }
  .qr-modal-qr{
    width:min(64vw, 220px);
    height:min(64vw, 220px);
    padding:16px;
    background:var(--paper);
    border:1.5px dashed rgba(44,58,82,.4);
    border-radius:10px;
    box-shadow:0 4px 10px rgba(35,30,20,.18);
    transition:background .2s ease;
  }
  .qr-modal-qr svg{ width:100%; height:100%; display:block; }
  .qr-modal-qr svg rect{ fill:var(--ink); }
  .qr-modal-label{
    font-family:var(--font-display);
    font-size:1.7rem;
    font-weight:700;
    margin:6px 0 0;
    text-align:center;
  }
  .qr-modal-hint{
    font-family:var(--font-hand);
    color:var(--ink-soft);
    font-size:.92rem;
    margin:0;
  }
  .qr-modal-url{
    font-family:var(--font-type);
    font-size:.76rem;
    color:var(--ink-soft);
    word-break:break-all;
    text-align:center;
    margin:0;
  }
  @media (prefers-reduced-motion: reduce){
    .qr-modal{ transition:none; }
  }

  /* ============ DOODLE LAYER: freehand drawing over the page ============
     A transparent canvas sits inside .page (so it scrolls and rotates
     with it) and only captures taps/drags while "draw mode" is on —
     otherwise pointer-events:none lets every card/link work as normal. */
  .doodle-canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:8;
    pointer-events:none;
    /* hidden by default, unconditionally — set in plain CSS rather than
       toggled on by JS, so there is no window (however small) where the
       canvas could paint at full opacity before a script gets a chance to
       hide it. JS only ever moves this forward, from 0 to 1, exactly once. */
    opacity:0;
  }
  .doodle-canvas.drawing-active{
    pointer-events:auto;
    touch-action:none;
    cursor:crosshair;
  }
  /* the actual "show it" state — added once, after the page has fully
     finished loading AND its own entrance animations (settle + card-in)
     have finished playing. With no saved drawing, this is added instantly
     at init — the empty canvas simply becomes usable right away. With a
     saved drawing, the canvas is revealed here at opacity:1 while still
     blank, and the strokes are then replayed onto it by JS (see
     animateDrawIn) so the drawing appears to draw itself in, rather than
     fading in already-complete. */
  .doodle-canvas.doodle-revealed{
    opacity:1;
  }

  .doodle-dock{
    position:fixed;
    left:50%;
    bottom:max(16px, env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:900;
    /* sized to exactly match the button below — this box IS the button's
       own hit area, so opening/closing the toolbar (which lives in the
       separately-anchored .doodle-toolbar-wrap) can never resize it and
       can never nudge the button off the spot it was dropped on */
    width:52px;
    height:52px;
    font-family:var(--font-hand);
  }

  .doodle-toolbar-wrap{
    position:absolute;
    bottom:calc(100% + 10px);
    /* left/transform are set by JS (see positionToolbarWrap): centered on
       the button whenever there's room, but nudged sideways (and/or up or
       down) just far enough to stay fully on-screen when the button sits
       near an edge. The button itself never moves to make room — it stays
       exactly where it was dropped, and only the toolbar adjusts. */
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  /* flipped when there isn't enough room above the button (e.g. it was
     dragged near the top edge) — opens downward instead */
  .doodle-toolbar-wrap.flip-down{
    bottom:auto;
    top:calc(100% + 10px);
  }

  .doodle-fab{
    width:52px; height:52px;
    border-radius:50%;
    border:none;
    background:var(--ink);
    color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 18px rgba(35,30,20,.35), 0 2px 5px rgba(0,0,0,.2);
    cursor:grab;
    touch-action:none;
    transition:background .18s ease, transform .18s ease;
    flex-shrink:0;
  }
  .doodle-fab svg{ width:22px; height:22px; }
  .doodle-fab path{ fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .doodle-fab:hover{ transform:translateY(-1px); }
  .doodle-fab:active{ cursor:grabbing; }
  .doodle-fab.active{ background:var(--string); }
  /* mid-drag: the button grows slightly so it's clear it's "picked up",
     then eases back to normal size the instant it's released */
  .doodle-fab.dragging{
    transform:scale(1.18);
    box-shadow:0 12px 26px rgba(35,30,20,.4), 0 4px 10px rgba(0,0,0,.25);
  }
  /* while being dragged, kill text selection so the button tracks the
     pointer exactly without the page trying to select nearby text */
  .doodle-dock.dragging{ user-select:none; -webkit-user-select:none; }

  .doodle-panel{
    display:flex;
    align-items:center;
    gap:4px;
    background:var(--paper);
    border:1px solid rgba(var(--ink-rgb),.12);
    border-radius:999px;
    padding:6px;
    box-shadow:0 10px 24px rgba(35,30,20,.3), 0 2px 6px rgba(0,0,0,.15);
    animation:doodle-pop .18s ease-out;
  }
  @keyframes doodle-pop{
    from{ opacity:0; transform:translateY(8px) scale(.94); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .doodle-btn{
    width:38px; height:38px;
    border-radius:50%;
    border:none;
    background:none;
    color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:background .15s ease, color .15s ease;
  }
  .doodle-btn svg{ width:18px; height:18px; }
  .doodle-btn path{ fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .doodle-btn:hover:not(:disabled){ background:rgba(var(--ink-rgb),.08); color:var(--ink); }
  .doodle-btn:disabled{ opacity:.35; cursor:default; }
  .doodle-btn.active{ background:var(--ink); color:var(--paper); }

  .doodle-sep{ width:1px; height:22px; background:rgba(var(--ink-rgb),.15); margin:0 2px; flex-shrink:0; }

  /* while draw mode is off, every toolbar control except the edit-mode
     toggle itself is greyed out and inert — you have to switch drawing
     on before pen/eraser/undo/redo/options/clear/save do anything */
  .doodle-panel.locked > *:not(#doodle-editmode){
    opacity:.35;
    pointer-events:none;
  }
  .doodle-options.locked{
    opacity:.35;
    pointer-events:none;
  }

  .doodle-save{
    position:relative;
    height:38px;
    padding:0 16px;
    border-radius:999px;
    border:none;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--font-hand);
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
    transition:background .15s ease, transform .1s ease;
  }
  .doodle-save:hover{ background:#233047; }
  .doodle-save:active{ transform:scale(.96); }
  .doodle-save:disabled{ opacity:.35; cursor:default; }
  .doodle-save.unsaved::after{
    content:"";
    position:absolute;
    top:2px; right:4px;
    width:8px; height:8px;
    border-radius:50%;
    background:var(--string);
    border:1.5px solid var(--paper);
  }

  .doodle-options{
    display:flex;
    flex-direction:column;
    gap:10px;
    background:var(--paper);
    border:1px solid rgba(var(--ink-rgb),.12);
    border-radius:16px;
    padding:14px 16px;
    box-shadow:0 10px 24px rgba(35,30,20,.3), 0 2px 6px rgba(0,0,0,.15);
    width:min(84vw, 300px);
    animation:doodle-pop .18s ease-out;
  }
  .doodle-options-row{ display:flex; align-items:center; gap:10px; }
  .doodle-label{ font-size:15px; color:var(--ink-soft); width:64px; flex-shrink:0; }

  /* the hidden attribute has to win over the flex display above, or the
     toolbar/options card stay visible (and their JS toggle stops doing
     anything) regardless of hidden being set — this is what made the
     sliders and trash buttons look unresponsive */
  .doodle-panel[hidden],
  .doodle-options[hidden]{
    display:none;
  }

  .doodle-pentypes{ display:flex; gap:6px; flex:1; }
  .doodle-pentype{
    flex:1;
    padding:6px 4px;
    font-family:var(--font-hand);
    font-size:13px;
    border-radius:8px;
    border:1.5px solid rgba(var(--ink-rgb),.2);
    background:none;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .doodle-pentype.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  .doodle-options input[type="range"]{
    flex:1;
    accent-color:var(--ink);
  }

  .doodle-colors{ display:flex; gap:7px; flex:1; flex-wrap:wrap; }
  .doodle-color{
    width:24px; height:24px;
    border-radius:50%;
    border:2px solid transparent;
    background:var(--c);
    padding:0;
    cursor:pointer;
    box-shadow:0 0 0 1px rgba(var(--ink-rgb),.25);
  }
  .doodle-color.active{ border-color:var(--paper); box-shadow:0 0 0 2px var(--ink); }
  .doodle-color-custom{
    display:flex; align-items:center; justify-content:center;
    background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);
    position:relative;
    overflow:hidden;
  }
  .doodle-color-custom input[type="color"]{
    position:absolute; inset:-4px;
    width:32px; height:32px;
    border:none; padding:0; cursor:pointer;
    opacity:0;
  }

  .doodle-toast{
    position:fixed;
    left:50%;
    bottom:calc(52px + max(16px, env(safe-area-inset-bottom)) + 60px);
    transform:translateX(-50%) translateY(6px);
    background:var(--ink);
    color:var(--paper);
    font-family:var(--font-hand);
    font-size:15px;
    padding:8px 16px;
    border-radius:999px;
    box-shadow:0 6px 16px rgba(0,0,0,.25);
    z-index:901;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .doodle-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:480px){
    .doodle-dock{ width:46px; height:46px; }
    .doodle-fab{ width:46px; height:46px; }
    .doodle-fab svg{ width:19px; height:19px; }
    .doodle-btn{ width:34px; height:34px; }
    .doodle-panel{ gap:2px; padding:5px; }
  }
</style>
</head>

     openQrModal() whenever a card's little QR square is tapped. -->
<div class="qr-modal-overlay" id="qr-modal-overlay" hidden>
