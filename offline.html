<script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Work+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Press+Start+2P&display=block" rel="stylesheet">
<style>
  /* ==========================================================
     Inlined from styles.css - only the rules 404.html actually
     uses (root tokens, reset/base, .container, .eyebrow, .btn,
     header/footer chrome, the floating scrollbar, and the
     pixel-portrait classes).
     ========================================================== */
  :root {
    --paper:       #f1f2ed;
    --paper-alt:   #e7e9e1;
    --ink:         #191b1a;
    --ink-soft:    #5b5f5a;
    --ink-faint:   #9a9d94;
    --accent:      #2d4159;
    --accent-soft: #7c93a6;
    --rule:        #d3d5cc;
    --radius: 3px;

    --font-display: "Newsreader", Georgia, serif;
    --font-body: "Work Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
    --font-pixel: "Press Start 2P", var(--font-mono), monospace;

    --space-1: .25rem; --space-2: .5rem;  --space-3: .75rem; --space-4: 1rem;
    --space-5: 1.5rem; --space-6: 2.25rem; --space-7: 3.5rem; --space-8: 5rem;
    --space-9: 7rem;   --space-10: 9rem;

    --wide: 1120px;

    color-scheme: light;
  }

  [data-theme="dark"] {
    --paper:       #14161a;
    --paper-alt:   #1b1e22;
    --ink:         #ecede7;
    --ink-soft:    #9a9d96;
    --ink-faint:   #666a63;
    --accent:      #8fadcb;
    --accent-soft: #5c7185;
    --rule:        #2a2d31;
    color-scheme: dark;
  }

  /* ---------- reset & base ---------- */
  * { box-sizing: border-box; }
  html {
    scroll-behavior: smooth;
    /* stops the browser's own native pull-to-refresh reload at the top
       of the page — the .refresh-bar below (see script section further
       down) replaces it with a tap-to-confirm button instead. `contain`
       isn't enough on Chrome/Android to block the native gesture; `none`
       is what actually does it — set on body too, since some WebViews
       check body's value instead of html's. */
    overscroll-behavior-y: none;
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
  }

  body {
    margin: 0;
    overscroll-behavior-y: none;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background .35s ease, color .35s ease;
  }

  h1, h2, h3, h4 {
    font-family: var(--font-display);
    font-weight: 500;
    line-height: 1.15;
    margin: 0 0 var(--space-4);
    color: var(--ink);
  }

  p { margin: 0 0 var(--space-4); }

  a {
    color: inherit;
    text-decoration: none;
  }

  img { max-width: 100%; display: block; }

  ::selection { background: var(--accent); color: var(--paper); }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  button {
    font-family: inherit;
    background: none;
    border: none;
    cursor: pointer;
    color: inherit;
  }

  * {
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- layout ---------- */
  .container {
    max-width: var(--wide);
    margin: 0 auto;
    padding: 0 var(--space-6);
  }
  @media (max-width: 640px) {
    .container { padding: 0 var(--space-5); }
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: .74rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 var(--space-3);
    display: block;
  }

  /* ---------- button ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    font-family: var(--font-mono);
    font-size: .85rem;
    letter-spacing: .02em;
    padding: .75em 1.3em;
    border: 1px solid var(--ink);
    border-radius: var(--radius);
    transition: background .2s ease, color .2s ease, border-color .2s ease;
  }
  .btn:hover { background: var(--ink); color: var(--paper); }
  [data-theme="dark"] .btn:hover { background: var(--ink); color: var(--paper); }

  /* ---------- link styles ---------- */
  .link-ink {
    background-image: linear-gradient(var(--accent), var(--accent));
    background-repeat: no-repeat;
    background-position: left bottom;
    background-size: 0% 1px;
    transition: background-size .28s ease;
    padding-bottom: 1px;
  }
  .link-ink:hover, .link-ink:focus-visible { background-size: 100% 1px; }

  /* ---------- header ---------- */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: color-mix(in srgb, color-mix(in srgb, var(--paper) 90%, black) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--rule);
  }
  .header-inner {
    max-width: var(--wide);
    margin: 0 auto;
    padding: var(--space-4) var(--space-6);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-5);
  }
  .wordmark {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 1rem;
    letter-spacing: .01em;
    color: var(--ink);
  }
  .site-nav {
    display: flex;
    align-items: center;
    gap: var(--space-6);
  }
  .site-nav-inner {
    display: flex;
    align-items: center;
    gap: var(--space-6);
  }
  .site-nav a {
    font-size: .92rem;
    color: var(--ink-soft);
  }
  .site-nav a:hover, .site-nav a.active { color: var(--ink); }
  .site-nav a.active { color: var(--accent); }
  .home-link {
    padding-left: 0 !important;
    padding-right: 0 !important;
    margin-right: 15px;
  }
  .header-tools {
    display: flex;
    align-items: center;
    gap: var(--space-3);
  }
  .theme-toggle {
    width: 34px; height: 34px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s ease, border-color .2s ease;
  }
  .theme-toggle:hover { border-color: var(--accent); }
  .theme-toggle svg { width: 15px; height: 15px; }
  .theme-toggle .icon-moon { display: none; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  [data-theme="dark"] .theme-toggle .icon-moon { display: block; }
  .nav-toggle {
    display: none;
    width: 34px; height: 34px;
    background: var(--paper);
    border-radius: 50%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: background .2s ease;
  }
  .nav-toggle span {
    width: 18px; height: 1px;
    background: var(--ink);
    transition: transform .25s ease, opacity .25s ease;
  }
  body.nav-open .nav-toggle span:nth-child(1) { transform: translateY(5px) rotate(45deg); }
  body.nav-open .nav-toggle span:nth-child(2) { opacity: 0; }
  body.nav-open .nav-toggle span:nth-child(3) { transform: translateY(-5px) rotate(-45deg); }

  @media (max-width: 700px) {
    .header-inner {
      flex-wrap: wrap;
      row-gap: 0;
      padding-bottom: 0;
    }
    .wordmark { order: 1; }
    .header-tools { order: 2; }
    .site-nav {
      order: 3;
      flex-basis: 100%;
      align-items: start;
      min-height: 0;
      display: grid;
      grid-template-rows: 0fr;
      overflow: hidden;
      transition: grid-template-rows 0.35s linear, visibility 0s linear 0.35s;
      visibility: hidden;
    }
    body.nav-open .site-nav {
      grid-template-rows: 1fr;
      visibility: visible;
      transition: grid-template-rows 0.35s linear, visibility 0s linear 0s;
    }
    .site-nav-inner {
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: var(--space-4);
      padding-bottom: var(--space-4);
    }
    .site-nav-inner a:first-child { margin-top: var(--space-4); }
    .nav-toggle { display: flex; }
  }

  /* ---------- footer ---------- */
  .site-footer {
    border-top: 1px solid var(--rule);
    padding: var(--space-7) 0 var(--space-6);
    background: color-mix(in srgb, var(--paper) 99%, black);
  }
  .footer-inner {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-4);
    justify-content: space-between;
    align-items: center;
  }
  .colophon {
    font-family: var(--font-mono);
    font-size: .76rem;
    color: var(--ink-faint);
    margin: 0;
  }
  .footer-links {
    display: flex;
    gap: var(--space-5);
    flex-wrap: wrap;
  }
  .footer-links a {
    font-family: var(--font-mono);
    font-size: .78rem;
    color: var(--ink-soft);
  }
  .footer-links a:hover { color: var(--accent); }
  .copyright {
    font-family: var(--font-mono);
    font-size: .74rem;
    color: var(--ink-faint);
    width: 100%;
    margin: var(--space-5) 0 0;
    padding-top: var(--space-5);
    border-top: 1px solid var(--rule);
  }
  @media (max-width: 700px) {
    .footer-inner {
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }
    .footer-links {
      justify-content: center;
      width: 100%;
    }
  }

  /* ---------- pull-to-refresh bar ----------
     Built by the script below. Positioned just under .site-header (its
     "top" is read from the header's live height in JS). Hidden above
     the viewport by default and slid into view once a pull-down gesture
     at the top of the page crosses the drag threshold. */
  .refresh-bar {
    position: fixed;
    left: 0;
    right: 0;
    z-index: 40;
    display: flex;
    justify-content: center;
    transform: translateY(-130%);
    transition: transform .28s ease;
    pointer-events: none;
  }
  .refresh-bar.is-visible {
    transform: translateY(0);
    pointer-events: auto;
  }
  .refresh-bar-btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    font-family: var(--font-mono);
    font-size: .78rem;
    letter-spacing: .02em;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: .5em 1em;
    margin-top: var(--space-3);
    box-shadow: 0 4px 12px color-mix(in srgb, var(--ink) 14%, transparent);
    transition: border-color .2s ease, background .2s ease;
  }
  .refresh-bar-btn:hover, .refresh-bar-btn:focus-visible {
    border-color: var(--accent);
  }
  .refresh-bar-btn svg {
    width: 14px;
    height: 14px;
    flex: none;
    transition: transform .2s ease;
  }
  .refresh-bar.is-loading .refresh-bar-btn svg {
    animation: refresh-bar-spin .7s linear infinite;
  }
  @keyframes refresh-bar-spin {
    to { transform: rotate(360deg); }
  }

  /* ---------- floating scrollbar ---------- */
  @media (pointer: fine) {
    html {
      -ms-overflow-style: none; /* IE and Edge */
      scrollbar-width: none; /* Firefox */
    }
    ::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Opera */
    }

    .custom-scrollbar-track {
      position: fixed;
      top: 0;
      right: 0;
      width: 40px;
      height: 100vh;
      z-index: 9999;
      pointer-events: none;
    }

    .custom-scrollbar-thumb {
      position: absolute;
      top: 0;
      right: 2px;
      width: 8px;
      border-radius: 10px;
      background-color: color-mix(in srgb, var(--paper) 70%, black);
      opacity: 0;
      transition: opacity 0.3s ease, background-color 0.2s ease;
      pointer-events: auto;
      cursor: grab;
    }

    .custom-scrollbar-thumb:active {
      cursor: grabbing;
      background-color: color-mix(in srgb, var(--paper) 50%, black);
    }

    .custom-scrollbar-track.is-visible .custom-scrollbar-thumb {
      opacity: 1;
    }
  }

  /* ---------- pixel portrait ---------- */
  .avatar-pixel-wrap {
    margin: var(--space-3) auto 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-3);
    text-align: center;
  }
  .avatar-pixel {
    width: clamp(120px, 24vw, 260px);
    height: clamp(120px, 24vw, 260px);
    aspect-ratio: 1 / 1;
    background: transparent;
  }
  .pixel-canvas {
    display: block;
    width: 100%;
    height: 100%;
    /* blow the small canvas up as crisp blocky squares, not a blur */
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
  }

  /* ---------- pixel portrait: error fallback ---------- */
  .avatar-pixel.is-error {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pixel-error {
    font-family: var(--font-pixel);
    font-size: clamp(0.85rem, 3vw, 1.35rem);
    line-height: 1.6;
    letter-spacing: .05em;
    color: var(--accent);
    text-align: center;
  }

  /* ---------- 404 page (scoped to this file only) ---------- */
  .not-found {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-4);
    min-height: 100vh;  /* fallback for browsers without svh support */
    /* svh (small viewport height), not dvh: dvh keeps recalculating live
       as the address bar hides/shows while scrolling, so a box sized
       with it visibly resizes on every frame of that transition — the
       "glitch" on mobile. svh is pinned to the viewport size with the
       address bar shown, so it never changes mid-scroll. */
    min-height: 100svh;
    padding: var(--space-6) 0;
  }
  /* the shared .avatar-pixel-wrap rule above sets left/right
     margin: auto for its normal single-column context — inside this
     flex row that auto margin eats the free space unevenly, pushing
     the avatar away from the divider. Zero it out here so the flex
     "gap" above is the only spacing at play. */
  .not-found .avatar-pixel-wrap {
    margin: 0;
  }
  .not-found-divider {
    /* a fixed height + the row's own align-items:center is what
       actually centers this line — align-self:stretch instead pins
       it to the top of the row once max-height caps its length. */
    height: 220px;
    width: 1px;
    background: var(--rule);
  }
  .not-found-message {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    max-width: 380px;
  }
  .not-found-title {
    font-size: clamp(2rem, 4.5vw, 2.75rem);
    font-style: italic;
    font-weight: 400;
  }
  .not-found-text {
    color: var(--ink-soft);
    margin-bottom: var(--space-5);
  }
  @media (max-width: 640px) {
    .not-found {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: var(--space-3);
      min-height: 100vh;  /* fallback for browsers without svh support */
      min-height: 100svh; /* see note on the base .not-found rule above */
      padding: var(--space-4) 0;
      transform: translateY(-3%);
    }
    .not-found-divider {
      display: none;
    }
    .not-found-message {
      align-items: center;
      text-align: center;
      max-width: 240px;
    }
    .avatar-pixel {
      width: clamp(60px, 20vw, 100px);
      height: clamp(60px, 20vw, 100px);
    }
    .not-found-title {
      font-size: clamp(1rem, 5vw, 1.3rem);
      margin-bottom: var(--space-2);
    }
    .not-found-text {
      font-size: .74rem;
      margin-bottom: var(--space-3);
    }
    .btn {
      font-size: .64rem;
      padding: .5em 0.9em;
    }
    .eyebrow {
      font-size: .56rem;
      margin-bottom: var(--space-2);
    }
  }
  @media (max-width: 380px) {
    .avatar-pixel {
      width: clamp(52px, 18vw, 80px);
      height: clamp(52px, 18vw, 80px);
    }
    .not-found-title {
      font-size: clamp(.9rem, 5.5vw, 1.1rem);
    }
    .not-found-text {
      font-size: .7rem;
    }
  }
  /* ---------- page reveal ---------- */
  /* Hidden by default and faded in once JS confirms fonts + the
     avatar image are both settled — see the "page reveal" script
     below. Without this, fonts/avatar arrive at slightly different
     times and the page paints itself piecemeal. The noscript rule
     right after this is the fallback for when JS doesn't run at all. */
  main {
    opacity: 0;
    transition: opacity .4s ease;
  }
  main.is-ready {
    opacity: 1;
  }
</style>
<noscript><style>main { opacity: 1; }</style></noscript>
</head>

</header>

<main>
  <div class="container">

    <section class="not-found">
      <div class="avatar-pixel-wrap">
        <div class="avatar-pixel" id="avatar-pixel" role="img" aria-label="Pixel portrait of Ashiqur Rahman"></div>
      </div>

      <div class="not-found-divider" aria-hidden="true"></div>

      <div class="not-found-message">
        <span class="eyebrow">Offline</span>
        <h1 class="not-found-title">You're offline.</h1>
        <p class="not-found-text">No connection right now. Once you're back online, this'll pick up right where it left off.</p>
        <button type="button" class="btn" onclick="location.reload()">Try again</button>
      </div>
    </section>

  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-inner">
      <p class="colophon">Set in Newsreader, Work Sans &amp; IBM Plex Mono.</p>
      <div class="footer-links">
        <a href="mailto:email@ashiqur.in">Email</a>
        <a href="https://blog.ashiqur.in/contact/">Contact</a>
        <a href="https://x.com/ashiqur_sf">Twitter</a>
      </div>
      <p class="copyright" style="text-align: center;">© <span id="year"></span> ashiqur • Personal Blog</p>
    </div>
  </div>
</footer>

<script>
/* ==========================================================
   Inlined from script.js — the pieces offline.html actually
   uses: header/footer chrome (theme toggle, mobile nav,
   footer year), the floating scrollbar, and the pixel-portrait
   painter (reads ashiqur.png).
   ========================================================== */

/* theme toggle (data-theme already set pre-paint by inline head script) */
(function () {
  "use strict";
  var toggle = document.querySelector(".theme-toggle");
  if (toggle) {
    toggle.addEventListener("click", function () {
      var root = document.documentElement;
      var current = root.getAttribute("data-theme") === "dark" ? "dark" : "light";
      var next = current === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
      var themeColorMeta = document.querySelector('meta[name="theme-color"]');
      if (themeColorMeta) {
        themeColorMeta.setAttribute("content", next === "dark" ? "#121417" : "#dcddd8");
      }
    });
  }

  /* mobile nav */
  var navToggle = document.querySelector(".nav-toggle");
  if (navToggle) {
    navToggle.addEventListener("click", function () {
      document.body.classList.toggle("nav-open");
    });
    document.querySelectorAll(".site-nav a").forEach(function (a) {
      a.addEventListener("click", function () {
        document.body.classList.remove("nav-open");
      });
    });
  }

  /* footer year */
  var yearEl = document.getElementById("year");
  if (yearEl) yearEl.textContent = new Date().getFullYear();
})();

/* pull-to-refresh prompt
   Rule: dragging down while already at the top of the page reveals a
   "Refresh" button positioned just under the header, instead of letting
   the browser trigger its own native pull-to-refresh reload (that
   native behaviour is suppressed via `overscroll-behavior-y: none` on
   html/body above). Tapping the button is what actually reloads the
   page. Touch-only: pull-to-refresh isn't a thing on desktop pointer
   devices. */
(function () {
  "use strict";
  if (!("ontouchstart" in window)) return;

  var DRAG_THRESHOLD = 70; // px of downward drag before the button appears

  var refreshBar = document.createElement("div");
  refreshBar.className = "refresh-bar";
  refreshBar.innerHTML =
    '<button type="button" class="refresh-bar-btn">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>' +
      "Refresh" +
    "</button>";
  document.body.appendChild(refreshBar);
  var refreshBtn = refreshBar.querySelector(".refresh-bar-btn");

  function positionRefreshBar() {
    var siteHeader = document.querySelector(".site-header");
    refreshBar.style.top = (siteHeader ? siteHeader.offsetHeight : 0) + "px";
  }
  positionRefreshBar();
  window.addEventListener("resize", positionRefreshBar);

  var dragStartY = null;
  var isDragging = false;
  var hasRevealed = false;

  document.addEventListener("touchstart", function (e) {
    if (window.scrollY > 0 || refreshBar.classList.contains("is-visible")) return;
    dragStartY = e.touches[0].clientY;
    isDragging = true;
    hasRevealed = false;
  }, { passive: true });

  document.addEventListener("touchmove", function (e) {
    if (!isDragging || dragStartY === null || hasRevealed) return;
    var dragDistance = e.touches[0].clientY - dragStartY;
    if (dragDistance > DRAG_THRESHOLD && window.scrollY === 0) {
      hasRevealed = true;
      positionRefreshBar();
      refreshBar.classList.add("is-visible");
    }
  }, { passive: true });

  document.addEventListener("touchend", function () {
    isDragging = false;
    dragStartY = null;
  });

  refreshBtn.addEventListener("click", function () {
    refreshBar.classList.add("is-loading");
    window.location.reload();
  });

  /* scrolling down to actually read, rather than tapping the button,
     tucks the prompt back out of the way */
  window.addEventListener("scroll", function () {
    if (refreshBar.classList.contains("is-visible") && window.scrollY > 40) {
      refreshBar.classList.remove("is-visible");
    }
  });
})();

/* page reveal — <main> starts at opacity:0 (see the CSS above).
   We wait for two things to settle: the web fonts, and the avatar
   image (loaded or errored, either is fine) — then fade the whole
   page in at once. This avoids the piecemeal look of fonts/avatar
   arriving at different moments during load. A timeout is a safety
   net in case something never resolves (e.g. no Font Loading API
   support), so the page is never stuck invisible. */
var pageReveal = (function () {
  var needed = { fonts: false, avatar: false };
  var revealed = false;

  function reveal() {
    if (revealed || !needed.fonts || !needed.avatar) return;
    revealed = true;
    var main = document.querySelector("main");
    if (main) main.classList.add("is-ready");
  }

  if (window.document && document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      needed.fonts = true;
      reveal();
    });
  } else {
    needed.fonts = true;
  }

  setTimeout(function () {
    needed.fonts = true;
    needed.avatar = true;
    reveal();
  }, 2500);

  return {
    avatarSettled: function () {
      needed.avatar = true;
      reveal();
    }
  };
})();

if (window.matchMedia('(pointer: fine)').matches) {

  const track = document.createElement('div');
  track.classList.add('custom-scrollbar-track');

  const thumb = document.createElement('div');
  thumb.classList.add('custom-scrollbar-thumb');

  track.appendChild(thumb);
  document.body.appendChild(track);

  let isScrolling = false;
  let isNearEdge = false;
  let isDragging = false;
  let scrollTimeout;

  function updateScrollbar() {
    const scrollHeight = document.documentElement.scrollHeight;
    const clientHeight = document.documentElement.clientHeight;

    // 1. Automatically find the header and measure its height
    const header = document.querySelector('.site-header');
    const headerHeight = header ? header.offsetHeight : 0;

    // 2. Adjust the track to start below the header
    track.style.top = `${headerHeight}px`;
    track.style.height = `calc(100vh - ${headerHeight}px)`;

    const trackHeight = clientHeight - headerHeight;

    if (scrollHeight <= clientHeight) {
      track.style.display = 'none';
      return;
    } else {
      track.style.display = 'block';
    }

    // 3. Calculate thumb height based on the new, shorter track
    const thumbHeight = Math.max((clientHeight / scrollHeight) * trackHeight, 40);
    thumb.style.height = `${thumbHeight}px`;

    // 4. Calculate position within the new track bounds
    const scrollTop = window.scrollY;
    const maxScroll = scrollHeight - clientHeight;
    const maxThumb = trackHeight - thumbHeight;
    const thumbTop = (scrollTop / maxScroll) * maxThumb;

    thumb.style.transform = `translateY(${thumbTop}px)`;
  }

  function updateVisibility() {
    if (isScrolling || isNearEdge || isDragging) {
      track.classList.add('is-visible');
      updateScrollbar();
    } else {
      track.classList.remove('is-visible');
    }
  }

  let ticking = false;
  window.addEventListener('scroll', () => {
    isScrolling = true;
    track.classList.add('is-visible');

    if (!ticking) {
      window.requestAnimationFrame(() => {
        updateScrollbar();
        ticking = false;
      });
      ticking = true;
    }

    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(() => {
      isScrolling = false;
      updateVisibility();
    }, 1000);
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) {
      isNearEdge = window.innerWidth - e.clientX < 40;
      updateVisibility();
    }
  });

  let startY = 0;
  let startScrollTop = 0;

  thumb.addEventListener('mousedown', (e) => {
    isDragging = true;
    startY = e.clientY;
    startScrollTop = window.scrollY;

    document.documentElement.style.setProperty('scroll-behavior', 'auto', 'important');
    document.body.style.userSelect = 'none';
    updateVisibility();
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;

    const scrollHeight = document.documentElement.scrollHeight;
    const clientHeight = document.documentElement.clientHeight;

    const header = document.querySelector('.site-header');
    const headerHeight = header ? header.offsetHeight : 0;
    const trackHeight = clientHeight - headerHeight;

    const maxScroll = scrollHeight - clientHeight;
    const maxThumb = trackHeight - thumb.offsetHeight;

    const deltaY = e.clientY - startY;
    const scrollDelta = (deltaY / maxThumb) * maxScroll;

    window.scrollTo({
      top: startScrollTop + scrollDelta,
      behavior: 'auto'
    });
  });

  window.addEventListener('mouseup', () => {
    if (isDragging) {
      isDragging = false;
      document.documentElement.style.removeProperty('scroll-behavior');
      document.body.style.userSelect = '';
      updateVisibility();
    }
  });

  window.addEventListener('resize', updateScrollbar);

  updateScrollbar();

}

/* pixel portrait — reads ashiqur.png, center-crops it to a square,
   and paints it onto a small canvas that's then stretched up with
   crisp/pixelated scaling. Deliberately avoids ctx.getImageData():
   most browsers block reading pixel data back out of a canvas when
   the page is opened via file:// instead of http(s)://, which
   silently produced an empty box before. Painting the canvas (and
   recolouring it, below) has no such restriction. */
(function () {
  "use strict";

  var mount = document.getElementById("avatar-pixel");
  if (mount) {
    var GRID = 32;
    var portraitImg = null;
    var portraitCtx = null;

    function accentColor() {
      return getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
    }

    function paintPortrait() {
      if (!portraitImg || !portraitCtx) return;
      var side = Math.min(portraitImg.naturalWidth, portraitImg.naturalHeight);
      var sx = (portraitImg.naturalWidth - side) / 2;
      var sy = (portraitImg.naturalHeight - side) / 2;

      portraitCtx.clearRect(0, 0, GRID, GRID);
      portraitCtx.globalCompositeOperation = "source-over";
      portraitCtx.drawImage(portraitImg, sx, sy, side, side, 0, 0, GRID, GRID);

      portraitCtx.globalCompositeOperation = "source-in";
      portraitCtx.fillStyle = accentColor();
      portraitCtx.fillRect(0, 0, GRID, GRID);
      portraitCtx.globalCompositeOperation = "source-over";
    }

    var img = new Image();
    img.onload = function () {
      var canvas = document.createElement("canvas");
      canvas.className = "pixel-canvas";
      canvas.width = GRID;
      canvas.height = GRID;
      portraitCtx = canvas.getContext("2d");
      portraitCtx.imageSmoothingEnabled = true;
      portraitCtx.imageSmoothingQuality = "high";
      portraitImg = img;
      mount.innerHTML = "";
      mount.appendChild(canvas);
      mount.classList.add("is-ready");
      paintPortrait();
      pageReveal.avatarSettled();
    };
    img.onerror = function () {
      console.warn('[avatar-pixel] could not load "ashiqur.png" — likely offline and it wasn\'t cached.');
      mount.innerHTML = "";
      var offlineEl = document.createElement("div");
      offlineEl.className = "pixel-error";
      offlineEl.textContent = "OFFLINE";
      mount.appendChild(offlineEl);
      mount.classList.add("is-error");
      mount.setAttribute("aria-label", "Portrait unavailable while offline");
      pageReveal.avatarSettled();
    };
    img.src = "https://blog.ashiqur.in/ashiqur.png";

    /* repaint in the new accent colour whenever the theme toggles */
    var themeObserver = new MutationObserver(paintPortrait);
    themeObserver.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["data-theme"]
    });
  }
})();
</script>
</body>
</html>
